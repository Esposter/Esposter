name: 🔍 Review

# The review of what lands on `ai/queue`: haiku reviewers over every window owed, one review issue per chunk of a passed
# window's findings, one fixer per issue, and a settle job that settles what the fixers left open. `main` moves only by the
# review's fast-forward through the passed prefix (`services/review`, `openspec/specs/infra/review/design.md`).
on:
  push:
    branches: [ai/queue]
  workflow_dispatch:
    inputs:
      from:
        description: "A range review starts after this sha; with `to`, it reviews `from..to` and never moves main"
        required: false
        type: string
      to:
        description: "A range review ends at this sha"
        required: false
        type: string

permissions:
  contents: read

jobs:
  review:
    # The settle job reads this name (`REVIEW_JOB_NAME`) to tell whether a run is still opening issues
    name: Review
    runs-on: ubuntu-latest
    # The review job alone holds the group: one run reviews and one waits behind it, so the next review starts as soon as
    # this one ends, while this run's fixers are still working. A newer waiting run replaces an older one, which is
    # harmless, since every run reviews everything owed at its start.
    concurrency:
      group: review-${{ inputs.from && 'range' || 'queue' }}
      cancel-in-progress: false
    # Bounded by the run's deadline (`REVIEW_RUN_DEADLINE`, 300 minutes), which leaves the batches past it for the next run
    # and lets the batches started before it finish. 360 minutes is GitHub's hosted maximum.
    timeout-minutes: 360
    outputs:
      fix_issues: ${{ steps.review.outputs.fix_issues }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ai/queue
          fetch-depth: 0
          token: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Install the packages and scripts
        uses: ./.github/actions/install-projects
        with:
          filter: ./{packages/*,scripts}

      - name: 🏗️ Build packages
        uses: ./.github/actions/run-cached-task
        with:
          task: build:packages
          paths: |
            packages/*/dist
            packages/*/src/index.ts
            packages/*/src/components/index.ts
          save: false

      - name: 🆔 Identify the reviewer
        run: |
          git config user.name "Q16solver"
          git config user.email "Q16solver@users.noreply.github.com"
          git config core.fileMode false
          echo "* -text" >> "$(git rev-parse --git-common-dir)/info/attributes"
          git rm -r -q --cached . && git reset -q --hard

      - name: 🤝 Trust the workspace
        uses: ./.github/actions/trust-workspace

      # A deadline the review leaves windows to is continued by a dispatch through the collector's token, so the job's own
      # token stays read-only
      - name: 🔍 Review
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          gh auth setup-git
          pnpm -C scripts ai:review --from "$FROM" --to "$TO" --findings-directory "$RUNNER_TEMP/review-findings"

      # Runs even when the review failed a window, so the issues already opened still reach their fixers
      - name: 📤 Upload findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-findings
          path: ${{ runner.temp }}/review-findings
          if-no-files-found: ignore
          retention-days: 7

  # One fix job per review issue of this run, in a matrix. No concurrency group: each fixer lands its commits on `ai/queue`
  # by pull and push, and a fixer that crashes leaves its issue open and whole for the settle job.
  fix:
    # The settle job reads this name (`getFixJobName`) to tell whether an issue's fixer is still on it
    name: Fix issue #${{ matrix.issue }}
    needs: review
    if: ${{ !cancelled() && needs.review.outputs.fix_issues != '' && needs.review.outputs.fix_issues != '[]' }}
    runs-on: ubuntu-latest
    # Bounded by the one fixer session the job runs, its own wall clock limit being 90 minutes
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.review.outputs.fix_issues) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ai/queue
          fetch-depth: 0
          token: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Install the packages and scripts
        uses: ./.github/actions/install-projects

      - name: 🏗️ Build packages
        uses: ./.github/actions/run-cached-task
        with:
          task: build:packages
          paths: |
            packages/*/dist
            packages/*/src/index.ts
            packages/*/src/components/index.ts
          save: false

      - name: 🆔 Identify the fixer
        run: |
          git config user.name "Q16solver"
          git config user.email "Q16solver@users.noreply.github.com"
          git config core.fileMode false
          echo "* -text" >> "$(git rev-parse --git-common-dir)/info/attributes"
          git rm -r -q --cached . && git reset -q --hard

      - name: 🤝 Trust the workspace
        uses: ./.github/actions/trust-workspace

      - name: 📥 Download findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-findings
          path: ${{ runner.temp }}/review-findings

      - name: 🔧 Fix
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          ISSUE: ${{ matrix.issue }}
        run: |
          gh auth setup-git
          pnpm -C scripts ai:review:fix --findings "$RUNNER_TEMP/review-findings/issue-$ISSUE.json"

  # Settles every review issue still open once the fixers are done: the ones this run's fixers left, the ones past the
  # fix matrix's cap, and the ones a crashed fixer left whole. One settler session per issue, oldest first, on the queue's tip.
  settle:
    name: Settle review issues
    needs: [review, fix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Bounded by GitHub's hosted maximum for the whole job, since it settles every open issue in turn. No settler starts past
    # the loop's deadline (`REVIEW_SETTLE_DEADLINE`), each settler session has its own wall clock limit of 120 minutes, and
    # the issues the deadline leaves stay open for the run it dispatches.
    timeout-minutes: 360
    # The settlers land their commits one at a time, so a second settle job waits behind the first rather than racing it
    concurrency:
      group: review-settle
      cancel-in-progress: false
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ai/queue
          fetch-depth: 0
          token: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Install the packages and scripts
        uses: ./.github/actions/install-projects

      - name: 🏗️ Build packages
        uses: ./.github/actions/run-cached-task
        with:
          task: build:packages
          paths: |
            packages/*/dist
            packages/*/src/index.ts
            packages/*/src/components/index.ts
          save: false

      - name: 🆔 Identify the settler
        run: |
          git config user.name "Q16solver"
          git config user.email "Q16solver@users.noreply.github.com"
          git config core.fileMode false
          echo "* -text" >> "$(git rev-parse --git-common-dir)/info/attributes"
          git rm -r -q --cached . && git reset -q --hard

      - name: 🤝 Trust the workspace
        uses: ./.github/actions/trust-workspace

      - name: ⚖️ Settle
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
        run: |
          gh auth setup-git
          pnpm -C scripts ai:review:settle
