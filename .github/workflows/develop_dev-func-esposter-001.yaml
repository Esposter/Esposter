# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - dev-func-esposter-001

on:
  push:
    branches:
      - develop

# Serialize deploys per branch but never cancel an in-flight deploy — a half-applied
# function deployment is worse than a stale one, so newer pushes queue behind the running deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Granted here as well as on the called workflow's job: a called workflow's token can only be the same or more
# restrictive than its caller's, and `id-token: write` is never a repository default — without it azure/login
# has no OIDC token to exchange.
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/deploy-function-app.yaml
    with:
      functionAppName: dev-func-esposter-001
      storageAccountName: devstesposter001
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
