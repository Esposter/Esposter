name: ♻️ Run Review Collector
# Called by ♻️ Review Collector at `@ai/queue`, and the ref is the point: GitHub runs a workflow file from the
# ref the event names — `main` for a status or a comment — and `main`'s copy is a release behind the remote state
# the newest copy defines (ref names, bot logins, the head branch filtered on). Pinning the call runs one copy
# whichever event fired; the checkout pins the same ref because `actions/checkout` defaults to the event sha.
on:
  workflow_call:

jobs:
  collect:
    name: Collect
    # Only the bot's reviews of the release pull request, CodeRabbit's own status on a commit `develop` carries
    # (every deployment writes one against the same commits) and the bot's own comments run a cycle — the
    # collector's marker comments would otherwise wake the cycle that posted them. The status event needs the
    # branch as well as the context: the bot writes that status on every pull request it is asked about,
    # renovate's included, and a cycle woken by one only reaches the gates and exits, having paid for a runner,
    # an install and a clone to do it. A status payload lists every branch carrying its sha, not just the ones
    # heading it, so a status on a sha `develop` has already moved past still names it. A CI run's completion
    # runs a cycle only when it is `main`'s and red — the one conclusion the repairer answers; every other branch's
    # CI, and a green `main`, would pay for a runner to reach the gates and exit.
    if: >-
      (github.event_name != 'pull_request_review' ||
      (github.event.review.user.login == 'coderabbitai[bot]' && github.event.pull_request.head.ref == 'develop')) &&
      (github.event_name != 'pull_request' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == 'main')) &&
      (github.event_name != 'status' ||
      (github.event.context == 'CodeRabbit' && contains(github.event.branches.*.name, 'develop'))) &&
      (github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == 'coderabbitai[bot]' && github.event.issue.pull_request)) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    # Every fire waits for the one ahead and re-reads the remote; on the job rather than the workflow so the
    # retrigger's wait never holds it
    concurrency:
      group: review-collector
      cancel-in-progress: false
    outputs:
      retriggerDelaySeconds: ${{ steps.collect.outputs.retriggerDelaySeconds }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same pin as the call that reached this file
          ref: ai/queue
          # `git cherry` cannot answer from a shallow clone; the collector token because a push made with
          # `GITHUB_TOKEN` starts no workflow runs, so `develop`'s CI would never fire on a collector push
          fetch-depth: 0
          token: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          # The drain runs a permission-skipping Claude session over untrusted review text in this checkout: git is
          # authenticated through `gh`, whose token the drain's child process is not given (`runDrain`)
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Install dependencies
        run: pnpm i

      # A fresh checkout has no `dist` and no barrel, and both the cycle and the drain resolve libraries through
      # them: `scripts` imports `@esposter/shared` by its published entry, and the drain's finishing checks — a
      # typecheck in the touched package, its test suites — every library the package reads. Restored from the
      # entry 🏗️ CI saves for this content, so a build here is the miss alone.
      - name: ♻️ Restore package builds
        id: restore
        uses: ./.github/actions/restore-package-builds

      - name: 🏗️ Build packages
        if: steps.restore.outputs.complete != 'true'
        run: pnpm build:packages

      - name: 🆔 Identify the collector
        # `fileMode` off: the install marks a package's `bin` executable, which reads as a dirty tree on Linux
        run: |
          git config user.name "Q16solver"
          git config user.email "Q16solver@users.noreply.github.com"
          git config core.fileMode false

      - name: 🤝 Trust the workspace
        uses: ./.github/actions/trust-workspace

      - name: ♻️ Collect
        id: collect
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
        run: |
          gh auth setup-git
          pnpm ai:coderabbit:collect

  # The one missing webhook, supplied: a rate limit lifts on CodeRabbit's clock and announces nothing, so this
  # job sleeps out the deadline the bot stated and runs the cycle again — which re-reads the pull request before
  # asking, since a review a session push started meanwhile would be cancelled by a retrigger posted blind
  retrigger:
    name: Retrigger
    needs: collect
    if: needs.collect.outputs.retriggerDelaySeconds != ''
    runs-on: ubuntu-latest
    # The cycle caps one sleep under this (`RETRIGGER_SLEEP_CAP_MS`) and relays a longer deadline across runs
    timeout-minutes: 90
    # The built-in token starts no workflow runs except by `workflow_dispatch`, the one thing this job does
    permissions:
      actions: write
    # Its own group, so a wait measured in the bot's minutes never holds back a session push; a newer run
    # carries the newer deadline and supersedes a pending one
    concurrency:
      group: review-collector-retrigger
      cancel-in-progress: true
    steps:
      - name: ⏳ Wait out the rate limit
        env:
          DELAY_SECONDS: ${{ needs.collect.outputs.retriggerDelaySeconds }}
        run: sleep "$DELAY_SECONDS"

      # The dispatch's ref only picks which copy of the caller's triggers runs — the caller pins this file
      - name: ♻️ Run the cycle again
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ReviewCollector.yaml --repo "$GITHUB_REPOSITORY" --ref ai/queue
