name: 🔎 CodeQL
# Advanced setup rather than GitHub's one-click default, which analyses every pull request against `main` — here
# That is the release and every renovate bump, and a full analysis per bump finds nothing a scan of the same tree
# On `main` does not. So `main` is what is scanned, plus a weekly run, because a query pack published after the
# Last release finds what the release's own scan could not have. An open alert on `main` is a red run here, which
# The review collector answers as it answers a red CI (docs: infra/review-collector/repair).

on:
  push:
    branches:
      - main
  schedule:
    - cron: "16 18 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    # `security-events: write` is the upload of the results to the Security tab, and the only write here
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    strategy:
      # The two languages CodeQL has for this tree, and between them the whole of it: `javascript-typescript`
      # Extracts `.vue`, `.html`, `.json` and `.yaml` alongside `.ts` and `.js`, and `actions` reads the workflows.
      # The rest of what the repository is written in — SQL, SCSS, shell, markdown — has no CodeQL extractor at
      # All, so there is no third entry to add. One language failing still reports the other, since neither
      # Analysis tells the other anything.
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `build-mode: none` keeps CodeQL off autobuild: neither language needs a build to be analysed, and the
      # Build this repository has is minutes of Nuxt for a scan that reads sources
      - name: 🔎 Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          build-mode: none
          languages: ${{ matrix.language }}

      - name: 🔎 Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  # `analyze` uploads its findings and exits 0 whatever they are, so an alert is a fact on the Security tab and
  # Nothing else. This gate reads them back for the ref just scanned and fails on any still open — a dismissed one
  # Is a person's decision and stays green — so that an alert is a red run the collector's repairer answers, and the
  # Failing step's log is the list it is handed. `analyze` waits for the upload's processing by default, so the
  # Alerts are current by the time this job starts.
  alerts:
    name: 🚦 Alerts
    needs: analyze
    if: ${{ !cancelled() }}
    permissions:
      security-events: read
    runs-on: ubuntu-latest
    steps:
      - name: 🚦 Gate on the analyses
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: 🚦 Gate on the open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          gh api --paginate "repos/$REPOSITORY/code-scanning/alerts?ref=$REF&state=open&per_page=100" \
            --jq '.[] | "\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line) \(.rule.id) — \(.most_recent_instance.message.text)"' \
            | tee alerts.txt
          test ! -s alerts.txt
