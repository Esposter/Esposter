name: 🛡️ Scorecard

# The Scorecard analysis of the default branch, published so the README badge shows its result. The action publishes
# only for the default branch, which is `ai/queue`, so it runs on each push to `ai/queue` rather than on a weekly
# schedule, since a scheduled run would publish a result for a tree nothing changed

on:
  push:
    branches:
      - ai/queue
  workflow_dispatch:

# Read-only for the workflow as a whole; the job's own grants below are the only writes
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # `security-events: write` uploads the SARIF to code scanning; `id-token: write` is what publishing the result
      # to the Scorecard API (and so the badge) needs, and only this job may hold it
      security-events: write
      id-token: write
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛡️ Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The results file is written before publishing, so both uploads run even when publishing fails
      - name: 📊 Upload artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: 🔎 Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
