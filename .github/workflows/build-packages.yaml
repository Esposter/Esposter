name: 🏗️ Build Packages
# Reusable workflow called by 🏗️ CI and 🏎️ Bench: builds every library once and publishes the `package-builds`
# artifact to the caller's run, and fills the hosted game data's mirror the coverage shards restore. Why the build
# runs under vp's traced cache is `openspec/specs/architecture/monorepo-tooling/design.md` → `## CI job shape`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-packages:
    name: Build Packages
    # The two callers' copies queue on the commit (monorepo-tooling.md → ## CI job shape)
    concurrency:
      group: build-packages-${{ github.sha }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies
      # Filtered to the libraries — the apps' trees are install work nothing here reads
      - name: 📦 Install dependencies
        uses: ./.github/actions/install-projects
        with:
          filter: ./packages/*

      - name: 🏗️ Build packages
        uses: ./.github/actions/run-cached-task
        with:
          task: build:packages
          paths: |
            packages/*/dist
            packages/*/src/index.ts
            packages/*/src/components/index.ts
            packages/genshin-world/src/generated/characterKitMap
      # The build writes the exports map and `inlinedDependencies` into each manifest, and nothing downstream
      # reads one — so an uncommitted manifest is green everywhere else
      - name: 🔍 Check generated manifest fields are committed
        run: git diff --exit-code -- "packages/*/package.json"
      # A replay restores what the recorded run wrote, so an incomplete tree fails here, where the cause is
      # readable, rather than as a missing barrel in `typecheck`
      - name: 🔍 Verify the build is complete
        uses: ./.github/actions/verify-package-builds
      # The coverage shards only restore the hosted game data's mirror, under the lock's hash. A lock no cache holds yet
      # is filled here, every object and index entry it names, and the cache action saves it under that key as this job
      # ends, before any shard starts. The fill runs on the built `@esposter/shared` and `@esposter/shared-node`, so it
      # follows the build
      - name: ♻️ Look up the game data mirror
        id: game-data-mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Esposter/cache/content
          key: game-data-mirror-${{ hashFiles('packages/genshin-world/src/generated/gameDataLock.json') }}
          lookup-only: true
      # Every object is named by its hash, so whatever an earlier lock's mirror holds is still valid, and the fill
      # downloads only what that mirror lacks
      - name: ♻️ Restore an earlier game data mirror
        if: steps.game-data-mirror.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Esposter/cache/content
          key: game-data-mirror-${{ hashFiles('packages/genshin-world/src/generated/gameDataLock.json') }}
          restore-keys: game-data-mirror-

      - name: 📥 Fill the game data mirror
        if: steps.game-data-mirror.outputs.cache-hit != 'true'
        working-directory: packages/genshin-world
        run: pnpm game-data:mirror
      # `*/dist` is the build output, and the generated barrels and the `src/generated` files a build hook writes
      # (gitignored) sit beside the sources; libraries only, so their common ancestor `packages` is where the artifact
      # unpacks
      - name: 📤 Upload package builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-builds
          path: |
            packages/*/dist
            packages/*/src/**/index.ts
            packages/*/src/generated/**
          if-no-files-found: error
