name: 🏗️ Build Packages
# Reusable workflow called by 🏗️ CI and 🏎️ Bench: builds every library once and publishes the `package-builds`
# artifact to the caller's run. Why the build is gated on a repo-wide content-hash cache, and why the gate reads
# the disk rather than `cache-hit`, is `apps/web/content/docs/architecture/monorepo-tooling.md` → `## CI job shape`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-packages:
    name: Build Packages
    # Serialises the two callers' copies of this job on the same commit, so the second restores what the first
    # saved; never cancelled, because the waiting job still owes its caller the artifact
    concurrency:
      group: build-packages-${{ github.sha }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 🔑 Get build cache keys
        id: keys
        uses: ./.github/actions/get-build-cache-keys
      # Exact key, no prefix restore: the path list includes a hand-written barrel under `src`, and a prefix hit
      # would extract another commit's copy of it over the checkout and build it, green
      - name: ♻️ Restore package builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.package-builds-paths }}
          key: package-builds-${{ steps.keys.outputs.package-builds-hash }}

      - name: 🔍 Verify package builds
        id: verify
        uses: ./.github/actions/verify-package-builds
      # The install hangs off the miss too: a hit uploads straight from the restored paths and needs no
      # `node_modules`. Filtered to the libraries plus the root closure that declares the toolchain — the apps'
      # trees are install work nothing here reads.
      - name: 📦 Install dependencies
        if: steps.verify.outputs.complete != 'true'
        run: pnpm --filter "./packages/*" --filter "{.}..." --fail-if-no-match i

      - name: 🏗️ Build packages
        if: steps.verify.outputs.complete != 'true'
        run: pnpm build:packages
      # The build writes the exports map and `inlinedDependencies` into each manifest, and nothing downstream
      # reads one — so an uncommitted manifest is green everywhere else
      - name: 🔍 Check generated manifest fields are committed
        if: steps.verify.outputs.complete != 'true'
        run: git diff --exit-code -- "packages/*/package.json"
      # As an assertion this time: after a build an incomplete tree is a broken build, and it fails here where
      # the cause is readable rather than as a missing barrel in `typecheck`
      - name: 🔍 Verify the build is complete
        uses: ./.github/actions/verify-package-builds
        with:
          fail-when-incomplete: true

      - name: 📤 Upload package builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-builds
          path: ${{ steps.keys.outputs.package-builds-paths }}
          if-no-files-found: error
