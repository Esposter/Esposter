name: 🏗️ Build Packages
# Reusable workflow called by 🏗️ CI and 🏎️ Bench: builds every library once and publishes the `package-builds`
# artifact to the caller's run. Why the build runs under vp's traced cache is
# `apps/web/content/docs/architecture/monorepo-tooling.md` → `## CI job shape`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-packages:
    name: Build Packages
    # Serialises the two callers' copies of this job on the same commit, so the second replays what the first
    # saved; never cancelled, because the waiting job still owes its caller the artifact
    concurrency:
      group: build-packages-${{ github.sha }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies
      # Filtered to the libraries — the apps' trees are install work nothing here reads
      - name: 📦 Install dependencies
        uses: ./.github/actions/install-projects
        with:
          filter: ./packages/*

      - name: 🏗️ Build packages
        uses: ./.github/actions/run-cached-task
        with:
          task: cached:build:packages
      # The build writes the exports map and `inlinedDependencies` into each manifest, and nothing downstream
      # reads one — so an uncommitted manifest is green everywhere else
      - name: 🔍 Check generated manifest fields are committed
        run: git diff --exit-code -- "packages/*/package.json"
      # A replay restores what the recorded run wrote, so an incomplete tree fails here, where the cause is
      # readable, rather than as a missing barrel in `typecheck`
      - name: 🔍 Verify the build is complete
        uses: ./.github/actions/verify-package-builds
      # `*/dist` is the build output and the generated barrels (gitignored) sit beside the sources; libraries only,
      # so their common ancestor `packages` is where the artifact unpacks
      - name: 📤 Upload package builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-builds
          path: |
            packages/*/dist
            packages/*/src/**/index.ts
          if-no-files-found: error
