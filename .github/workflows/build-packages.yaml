name: 🏗️ Build Packages
# Reusable workflow: build every non-app package once (ctix barrels + tsdown bundles) and publish the
# output as the `package-builds` artifact for the caller's downstream jobs. Called by both 🏗️ CI and 🏎️ Bench
# via `uses: ./.github/workflows/build-packages.yaml`, so there is a single definition of the build + its cache
# key. Artifacts are run-scoped (a reusable workflow shares the caller's run, so the artifact reaches the
# caller's other jobs), but the `actions/cache` entry below is keyed by content hash and shared repo-wide across
# workflows — so a 🏗️ CI build of a given content hash gives 🏎️ Bench a cache hit for free (and vice versa),
# letting whichever workflow runs second skip the build entirely.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-packages:
    name: Build Packages
    # 🏗️ CI and 🏎️ Bench both trigger on a push to any branch, so without this their two copies of this job run
    # at the same time, each restoring the cache before the other has saved it — the shared-cache benefit above
    # only ever materialises for a *later* push, never for the pair the same push starts, and the build is paid
    # twice concurrently. Grouping on the commit serialises exactly that pair: the second one waits and then
    # restores what the first saved. Never `cancel-in-progress` — the waiting job is the one that still owes its
    # caller the `package-builds` artifact.
    concurrency:
      group: build-packages-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      # The key is computed by a shared action so the save here and every restore elsewhere derive it from
      # One definition — 🏗️ Pulumi and the two Functions deploys restore this same entry.
      - name: 🔑 Get package builds key
        id: key
        uses: ./.github/actions/get-package-builds-key
      # `packages/*/dist` is the published build output and `packages/*/src/**/index.ts` are the ctix-generated
      # Barrels (gitignored, absent on a fresh checkout). Both are produced by `pnpm build:packages`.
      #
      # Exact key only, and it stays that way. This glob also catches the one hand-written directory barrel
      # Under a package's `src`, which the key covers as the tracked file it is — so a hit proves the restored
      # Copy is the checked-out copy. Restoring this entry by prefix would extract another commit's version of
      # That file over the checkout and build it, green, which is why the prefix restore below is a separate
      # Entry holding only paths that no commit can author.
      - name: ♻️ Restore package builds
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/dist
            packages/*/src/**/index.ts
          key: package-builds-${{ steps.key.outputs.hash }}
      # A second entry under the same content hash, holding only what is safe to restore stale, and reached by
      # Prefix so that a miss on the exact key still finds the previous build's copy.
      #
      # It exists because barrel generation is the expensive half of a cold build. Bundling a package is quick;
      # Generating its barrel is a TypeScript program, and the same tree builds an order of magnitude faster
      # Once every fingerprint is current. `generateExports` already skips generation per package on that
      # Fingerprint, but nothing restored the file here, so the skip only ever fired on a developer's machine
      # And every miss regenerated all of them, including for the packages the commit never touched.
      #
      # Every path here is generated — the root barrel, the component barrel the one Vue package's extra ctix
      # Pass writes, and the fingerprints — so no commit authors any of them and a stale copy can overwrite
      # Nothing a checkout wrote. Staleness decides nothing either: the fingerprint hashes the source list,
      # each file's export bit and the generator, so a restored barrel survives only where all three are
      # Identical and is regenerated over otherwise. Losing these files costs the cold build we have today.
      #
      # Gated on the exact miss, which also gates the save the action registers for it — on a hit this job
      # Neither restores nor writes the entry, and its cost stays the restore and the upload.
      - name: ♻️ Restore barrel generation cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/src/index.ts
            packages/*/src/components/index.ts
            packages/*/node_modules/.cache/ctix-source-fingerprint
          key: barrel-generation-${{ steps.key.outputs.hash }}
          restore-keys: barrel-generation-
      # A prefix hit can carry a package that has since been deleted, which lands as a directory holding
      # Nothing but generated output. Nothing builds it — `pnpm -r` reads the workspace, which no longer names
      # It — but the artifact glob below would ship it to every consuming job and the save above would carry it
      # Forward for good. A package is the manifest that declares it, so its absence is the whole test.
      - name: 🧹 Prune deleted packages
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          for barrel in packages/*/src/index.ts; do
            [ -e "$barrel" ] || continue
            package="${barrel%/src/index.ts}"
            if [ ! -f "$package/package.json" ]; then
              echo "Pruning restored output for deleted package: $package"
              rm -rf "$package"
            fi
          done
      # Both the install and the build hang off the cache miss, and in that order: the key is computed from
      # tracked files with `git ls-tree` and the artifact is uploaded straight from the restored paths, so on a
      # hit this job needs no `node_modules` at all. Every job in both callers `needs` this one, so an install
      # nothing goes on to use is latency the whole workflow waits behind.
      #
      # Filtered rather than a plain `pnpm i`: this job builds `!@esposter/app`, so the app's dependency tree
      # And its `postinstall: nuxt prepare` are install work nothing here reads. Every other postinstall still
      # Runs, for the projects that are installed — the project set narrows, scripts are not disabled.
      - name: 📦 Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm --filter "!@esposter/app" i

      - name: 🏗️ Build packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm build:packages
      # Single gated build, then fan the output out to every consuming job as one artifact (dist + barrels share
      # The `packages/` common ancestor, so consumers download into `packages`). No hidden-file flag needed —
      # Neither `dist` nor `index.ts` is a dotfile.
      - name: 📤 Upload package builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-builds
          path: |
            packages/*/dist
            packages/*/src/**/index.ts
          if-no-files-found: error
