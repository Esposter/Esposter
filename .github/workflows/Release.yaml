name: 🚀 Release

# The nightly release, of main: only what a review has passed ships. `check` first recovers the latest tag when its release
# is missing or a draft. Otherwise `release` runs `pnpm release`, which gates the tree, versions and tags main's new commits,
# pushes the version commit and its tags to main, and publishes the new versions through npm trusted publishing. Then
# `finish` runs FinishRelease.yaml on the tag: the draft, the Windows host, and the public release last. The push that
# `pnpm release` makes to main starts the review run that merges main into ai/queue (`MergeMain.yaml`), so nothing here
# dispatches it.
on:
  schedule:
    # Nightly, at 15:16 UTC
    - cron: "16 15 * * *"
  workflow_dispatch:

permissions: read-all

# A run waits behind an earlier one rather than racing it onto the same tag. RecoverRelease.yaml shares this group
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for unreleased commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.check.outputs.tag }}
      recover-tag: ${{ steps.check.outputs.recover-tag }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 🔎 Check for unreleased commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git describe --tags --abbrev=0)"
          # A latest tag whose release is missing or still a draft is one a previous run did not finish, so it is finished
          # before anything new ships: the night after a failed run finishes it with no one dispatching the workflow
          recover=""
          if isDraft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/releaseError")"; then
            if [ "$isDraft" = true ]; then recover="$tag"; fi
          elif grep -qi 'release not found' "$RUNNER_TEMP/releaseError"; then
            recover="$tag"
          else
            printf 'Could not read release %s: %s\n' "$tag" "$(cat "$RUNNER_TEMP/releaseError")" >&2
            exit 1
          fi
          if [ -n "$recover" ]; then
            echo "Finishing $recover, whose release a previous run did not finish."
            echo "recover-tag=$recover" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-list --count "$tag..HEAD")" = 0 ]; then
            echo "No commit since $tag, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # The push goes through the collector's token, not the workflow's: main's ruleset lets only the Admin role update it, the role
  # the review's fast-forward pushes with. The same job holds id-token: write, which npm's trusted publishing exchanges for each
  # package's publish, so the versions the release pushes are the ones it publishes, with no second job to fetch them again.
  release:
    name: Release
    needs: check
    if: needs.check.outputs.skip == 'false' && needs.check.outputs.recover-tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          persist-credentials: true

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Install the workspace
        uses: ./.github/actions/install-projects

      - name: 🆔 Identify the releaser
        run: |
          git config user.name "Q16solver"
          git config user.email "Q16solver@users.noreply.github.com"

      # `scripts` too: the root's oxlint config loads its plugins, so the gates need the `scripts` project's dependencies
      - name: 📢 Release
        run: pnpm release

      - name: 🏷️ Read the tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

  # The tag this night released, or the one `check` found unfinished. Skipped on a quiet night, and a failed `pnpm release`
  # ends the run before it, so no release is drafted for a tag that npm never received
  finish:
    name: Finish
    needs: [check, release]
    if: always() && needs.check.outputs.skip == 'false' && (needs.release.result == 'success' || needs.check.outputs.recover-tag != '')
    uses: ./.github/workflows/FinishRelease.yaml
    with:
      tag: ${{ needs.check.outputs.recover-tag || needs.release.outputs.tag }}
    permissions:
      contents: write
      id-token: write
