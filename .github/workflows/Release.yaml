name: 🚀 Release

on:
  push:
    tags:
      - v*.*.*

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # No checkout: the release is two `gh` calls against the API, addressed by `--repo`, and the tag they name is
    # already on the remote — it is what started this run. Nothing here reads the tree.
    steps:
      - name: 🚀 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A re-run of a workflow whose release already landed must be a no-op, not a failure: `gh release create`
        # errors on an existing tag, so a retry after any later step failed reports the release step as broken.
        # Only a genuine "not found" is evidence the release is absent — a 401, a secondary rate limit or a
        # network blip exits non-zero too, and reading that as absence sends the retry into `create` against a
        # tag that is already released, which fails the job for exactly the reason this guard exists to prevent.
        # So the error text decides, and anything else fails here where the cause is still readable
        run: |
          if releaseError="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>&1 > /dev/null)"; then
            echo "Release $GITHUB_REF_NAME already exists, nothing to create."
            exit 0
          elif ! printf '%s' "$releaseError" | grep -qi 'release not found'; then
            printf 'Could not determine whether release %s exists: %s\n' "$GITHUB_REF_NAME" "$releaseError" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "For releases, please refer to [CHANGELOG.md](https://github.com/esposter/esposter/blob/main/CHANGELOG.md) for details."

  # The agent console's Windows host: one executable carrying its runtime and the Claude Code binary it runs, attached
  # To the release the page links as its download. One file rather than a zip, since Windows runs an exe from inside a
  # Zip without the files beside it. Unsigned, since signing costs a yearly fee
  # (apps/web/content/docs/infra/deferred/signed-host-installers.md)
  host-installer:
    needs: release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Install the host
        uses: ./.github/actions/install-projects
        with:
          filter: agent-console-server...
      # The executable bundles the host's workspace dependencies from their builds
      - name: 🏗️ Build the host's workspace dependencies
        run: pnpm --filter "agent-console-server^..." build

      - name: 🏗️ Build the Windows host
        run: pnpm -C packages/agent-console-server build:sea
      # --clobber so a re-run replaces the asset rather than failing on the one the first run attached
      - name: 📤 Attach the Windows host
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" packages/agent-console-server/dist-sea/agent-console-host.exe --repo "$env:GITHUB_REPOSITORY" --clobber
