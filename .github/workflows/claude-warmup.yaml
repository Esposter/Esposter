name: 🔥 Claude Warmup

on:
  schedule:
    # Every 6 hours — the 5-hour usage window plus an hour of slack for a slow run
    - cron: "16 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    name: Warmup
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 🤝 Trust the workspace
        uses: ./.github/actions/trust-workspace

      - name: 🔥 Warm up Claude Code session
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: pnpm dlx @anthropic-ai/claude-code -p "hi"
