name: 🚀 Deploy Function App
# Reusable workflow: build `@esposter/functions` and deploy it to one function app. Called by the two
# per-branch workflows via `uses: ./.github/workflows/deploy-function-app.yaml`, so a fix to the deploy reaches
# both stacks — the pair it replaced differed only in the branch it triggered on and the two resource names
# below, which is how a prod-only edit used to become drift.
#
# Concurrency stays on the callers: `github.workflow` inside a called workflow names the caller, and each of
# them has its own name, so grouping there keeps the two stacks' deploys independent exactly as before.
on:
  workflow_call:
    inputs:
      functionAppName:
        description: The function app to deploy to, and the blob container the package is staged in.
        required: true
        type: string
      storageAccountName:
        description: The storage account holding that container, whose firewall the runner is added to.
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        description: The federated credential azure/login exchanges its OIDC token against.
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: The subscription the storage account and function app live in.
        required: true
      AZURE_TENANT_ID:
        description: The tenant that credential belongs to.
        required: true

env:
  FUNCTION_APP_NAME: ${{ inputs.functionAppName }}
  STORAGE_ACCOUNT_NAME: ${{ inputs.storageAccountName }}
  OUTPUT_DIRECTORY: dist
  ZIP_FILE_NAME: release.zip

jobs:
  build-and-deploy:
    name: Build and Deploy
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 🏗️ Build the function app
        uses: ./.github/actions/build-app
        with:
          package: "@esposter/functions"

      - name: 📦 Collect Deployment Output
        run: |
          pnpm --filter @esposter/functions deploy --prod "$OUTPUT_DIRECTORY" --config.inject-workspace-packages=true --config.node-linker=hoisted
          cp apps/functions/host.json "$OUTPUT_DIRECTORY/host.json"

      - name: 📦 Zip Artifact for Deployment
        run: cd "$OUTPUT_DIRECTORY" && zip -r "../$ZIP_FILE_NAME" . -x@.funcignore

      - name: 🔑 Azure CLI Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🌐 Get GitHub Runner IP
        id: get_ip
        run: |
          runner_ip="$(curl --fail --silent --show-error --proto '=https' https://ipinfo.io/ip)"
          if ! printf '%s' "$runner_ip" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "Unexpected runner IP response: $runner_ip" >&2
            exit 1
          fi
          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"

      - name: 📡 Allow Runner IP in Storage Account Firewall
        env:
          RUNNER_IP: ${{ steps.get_ip.outputs.runner_ip }}
        run: az storage account network-rule add --account-name "$STORAGE_ACCOUNT_NAME" --ip-address "$RUNNER_IP"

      - name: 🚀 Upload Package to Blob Storage
        run: |
          az storage container create --account-name "$STORAGE_ACCOUNT_NAME" --name "$FUNCTION_APP_NAME" --auth-mode login --public-access off || true
          az storage blob upload --account-name "$STORAGE_ACCOUNT_NAME" --container-name "$FUNCTION_APP_NAME" --name "$ZIP_FILE_NAME" --file "$ZIP_FILE_NAME" --auth-mode login --overwrite

      # `always()` so the rule is removed even when the upload failed.
      - name: 📡 Remove Runner IP from Storage Account Firewall
        if: always()
        env:
          RUNNER_IP: ${{ steps.get_ip.outputs.runner_ip }}
        run: az storage account network-rule remove --account-name "$STORAGE_ACCOUNT_NAME" --ip-address "$RUNNER_IP"
