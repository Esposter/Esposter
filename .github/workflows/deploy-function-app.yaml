name: 🚀 Deploy Function App
# Reusable workflow: build `@esposter/functions` and deploy it to one function app. Called by the two
# Per-branch workflows via `uses: ./.github/workflows/deploy-function-app.yaml`, so a fix to the deploy reaches
# Both stacks — the pair it replaced differed only in the branch it triggered on and the two resource names
# Below, which is how a prod-only edit used to become drift.
#
# Concurrency stays on the callers: `github.workflow` inside a called workflow names the caller, and each of
# them has its own name, so grouping there keeps the two stacks' deploys independent exactly as before.
on:
  workflow_call:
    inputs:
      functionAppName:
        description: The function app to deploy to, and the blob container the package is staged in.
        required: true
        type: string
      storageAccountName:
        description: The storage account holding that container, whose firewall the runner is added to.
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        description: The federated credential azure/login exchanges its OIDC token against.
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: The subscription the storage account and function app live in.
        required: true
      AZURE_TENANT_ID:
        description: The tenant that credential belongs to.
        required: true

env:
  OUTPUT_DIRECTORY: dist
  PACKAGE_PATH: apps/functions
  ZIP_FILE_NAME: release.zip

jobs:
  build-and-deploy:
    name: Build and Deploy
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔨 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      # 🏗️ CI already built every non-app package at this content hash and saved it under this key, and
      # `@esposter/functions` is one of them — so on a hit this job builds nothing and deploys exactly the
      # Bundle CI checked. Restore only: this job builds a subset, so saving from here would publish a partial
      # `dist` set under the full build's key.
      - name: 🔑 Get build cache keys
        id: keys
        uses: ./.github/actions/get-build-cache-keys

      - name: ♻️ Restore package builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.package-builds-paths }}
          key: package-builds-${{ steps.keys.outputs.package-builds-hash }}

      - name: 🔧 Resolve Project Dependencies
        run: pnpm --filter @esposter/functions... i
      # Gated on the build output rather than on the restore's `cache-hit`: that flag reports the entry the cache
      # Found, not what it extracted, so a `path` list that drifted from the save's reports a hit while a build
      # Skipped on it zips an empty `dist` and deploys a function app that registers nothing, with the host still
      # Reporting Running. Every building package's `dist` is read rather than this one's — a partial extract
      # Satisfies a single-file probe exactly when it should not.
      - name: 🔍 Verify package builds
        id: verify
        uses: ./.github/actions/verify-package-builds

      - name: 🏗️ Build
        if: steps.verify.outputs.complete != 'true'
        run: pnpm --filter @esposter/functions... build

      - name: 📦 Collect Deployment Output
        run: |
          pnpm --filter @esposter/functions deploy --prod ${{ env.OUTPUT_DIRECTORY }} --config.inject-workspace-packages=true --config.node-linker=hoisted
          cp ${{ env.PACKAGE_PATH }}/host.json ${{ env.OUTPUT_DIRECTORY }}/host.json

      - name: 📦 Zip Artifact for Deployment
        run: |
          pushd ${{ env.OUTPUT_DIRECTORY }}
          zip -r ../${{ env.ZIP_FILE_NAME }} . -x@.funcignore
          popd

      - name: 🔑 Azure CLI Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🌐 Get GitHub Runner IP
        id: get_ip
        run: |
          runner_ip="$(curl --fail --silent --show-error --proto '=https' https://ipinfo.io/ip)"
          if ! printf '%s' "$runner_ip" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "Unexpected runner IP response: $runner_ip" >&2
            exit 1
          fi
          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"

      - name: 📡 Allow Runner IP in Storage Account Firewall
        env:
          RUNNER_IP: ${{ steps.get_ip.outputs.runner_ip }}
        run: |
          az storage account network-rule add \
            --account-name ${{ inputs.storageAccountName }} \
            --ip-address "$RUNNER_IP"

      - name: 🚀 Upload Package to Blob Storage
        run: |
          az storage container create --account-name ${{ inputs.storageAccountName }} --name ${{ inputs.functionAppName }} --auth-mode login --public-access off || true
          az storage blob upload --account-name ${{ inputs.storageAccountName }} --container-name ${{ inputs.functionAppName }} --name ${{ env.ZIP_FILE_NAME }} --file ${{ env.ZIP_FILE_NAME }} --auth-mode login --overwrite

      - name: 📡 Remove Runner IP from Storage Account Firewall
        if: always() # This ensures the rule is removed even if deployment fails
        env:
          RUNNER_IP: ${{ steps.get_ip.outputs.runner_ip }}
        run: |
          az storage account network-rule remove \
            --account-name ${{ inputs.storageAccountName }} \
            --ip-address "$RUNNER_IP"
