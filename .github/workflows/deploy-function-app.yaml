name: 🚀 Deploy Function App
# One workflow deploys `@esposter/functions` to both stacks: a push to `develop` ships the dev function app, a
# push to `main` the prod one, and the branch is the only thing that picks the two resource names below — so
# there is no second copy for a prod-only edit to drift from.

on:
  push:
    branches:
      - develop
      - main

# Serialize deploys per branch but never cancel an in-flight deploy — a half-applied
# function deployment is worse than a stale one, so newer pushes queue behind the running deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# `id-token: write` is never a repository default — without it azure/login has no OIDC token to exchange.
permissions:
  contents: read
  id-token: write

# The maps are keyed by the branches `on.push` lists, so a branch added there without a row here fails on an
# empty name at the first `az` call rather than deploying anywhere.
env:
  FUNCTION_APP_NAME: ${{ fromJSON('{"develop":"dev-func-esposter-001","main":"prod-func-esposter-001"}')[github.ref_name] }}
  STORAGE_ACCOUNT_NAME: ${{ fromJSON('{"develop":"devstesposter001","main":"prodstesposter001"}')[github.ref_name] }}
  OUTPUT_DIRECTORY: dist
  ZIP_FILE_NAME: release.zip

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 🏗️ Build the function app
        uses: ./.github/actions/build-app
        with:
          package: "@esposter/functions"

      # `pnpm deploy` copies what the manifest's `files` lists, and that list is where `host.json` rides along
      - name: 📦 Collect Deployment Output
        run: pnpm --filter @esposter/functions deploy --prod "$OUTPUT_DIRECTORY" --config.inject-workspace-packages=true --config.node-linker=hoisted

      - name: 📦 Zip Artifact for Deployment
        working-directory: ${{ env.OUTPUT_DIRECTORY }}
        run: zip -r "../$ZIP_FILE_NAME" . -x@.funcignore

      - name: 🔑 Azure CLI Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🌐 Get GitHub Runner IP
        id: get_ip
        run: |
          runner_ip="$(curl --fail --silent --show-error --proto '=https' https://ipinfo.io/ip)"
          if ! printf '%s' "$runner_ip" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "Unexpected runner IP response: $runner_ip" >&2
            exit 1
          fi
          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"

      - name: 📡 Allow Runner IP in Storage Account Firewall
        env:
          RUNNER_IP: ${{ steps.get_ip.outputs.runner_ip }}
        run: az storage account network-rule add --account-name "$STORAGE_ACCOUNT_NAME" --ip-address "$RUNNER_IP"

      # `container create` is idempotent — an existing container is `created: false` and exit 0, so the only thing
      # a `|| true` here could swallow is a real failure (a revoked role, a container mid-delete), which then
      # surfaces one line later as an upload that cannot find its container.
      - name: 🚀 Upload Package to Blob Storage
        run: |
          az storage container create --account-name "$STORAGE_ACCOUNT_NAME" --name "$FUNCTION_APP_NAME" --auth-mode login --public-access off
          az storage blob upload --account-name "$STORAGE_ACCOUNT_NAME" --container-name "$FUNCTION_APP_NAME" --name "$ZIP_FILE_NAME" --file "$ZIP_FILE_NAME" --auth-mode login --overwrite

      # `always()` so the rule is removed even when the upload failed — and gated on the IP having been read, so a
      # run that failed before the firewall was ever touched reports that failure rather than an `az` call with an
      # empty `--ip-address`.
      - name: 📡 Remove Runner IP from Storage Account Firewall
        if: ${{ always() && steps.get_ip.outputs.runner_ip != '' }}
        env:
          RUNNER_IP: ${{ steps.get_ip.outputs.runner_ip }}
        run: az storage account network-rule remove --account-name "$STORAGE_ACCOUNT_NAME" --ip-address "$RUNNER_IP"
