name: 🔁 Renovate Manifest

# tsdown writes each package's `exports` map, the entry fields it owns and `inlinedDependencies` into that
# package's `package.json`, and those writes are committed — `inlinedDependencies` in particular is the only
# account of what a self-contained bundle vendored, down to the transitive closure for the Functions app. A
# dependency bump therefore changes a manifest, and Renovate cannot make that change: it edits the catalog and
# the lockfile and regenerates nothing, and the hook that would (`postUpgradeTasks`) is self-hosted-only while
# this repository runs the hosted app. Left alone, every bundled bump and every lock file maintenance run would
# land a manifest that no longer describes its own dist, so 🏗️ Build Packages stands its committed-manifest
# check aside on these branches and this workflow supplies the missing write instead.
#
# It is deliberately not a step inside 🏗️ CI. That check is working, its token is `contents: read`, and the
# write wanted here is needed on one branch prefix out of all of them — bought for every branch it would be the
# broadest possible reading of a narrow need. Renovate's own branches are also the only ones where a rebuild is
# affordable: a handful of pushes a week, none of them latency-sensitive.
on:
  push:
    branches:
      - "renovate/**"

# Declared empty so each job below states its own, and a job added later inherits nothing.
permissions: {}

# A Renovate branch is force-pushed in place when the update it carries changes, which makes anything computed
# From the superseded head stale by definition.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build half: reads the tree, runs the toolchain, and hands the result on as an artifact. It holds a
  # read-only token, which is the point of the split — this is the job that executes third-party code (every
  # postinstall in the tree, every plugin the build loads), and it is the job that cannot push.
  #
  # No cache is read or written here. `package-builds` is keyed on a content hash that a Renovate branch always
  # Misses, so there is nothing to restore; and restoring one would defeat the job outright, because the
  # Manifest fields are written by the build rather than carried in its output — a hit would skip the build and
  # Regenerate nothing. The duplicate build against 🏗️ CI's is accepted for the same reason.
  regenerate:
    name: Regenerate Manifests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies
      # `!@esposter/app` for the same reason 🏗️ Build Packages filters it out: this builds every package but the
      # App, so the app's tree and its `postinstall: nuxt prepare` are install work nothing here reads.
      - name: 📦 Install dependencies
        run: pnpm --filter "!@esposter/app" i

      - name: 🏗️ Build packages
        run: pnpm build:packages
      # Printed as well as counted, so the versions that moved are readable in this run rather than only in the
      # Commit the next job makes.
      - name: 🔍 Diff the generated manifest fields
        id: diff
        run: |
          if git diff --quiet -- "packages/*/package.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff -- "packages/*/package.json"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The manifests alone, not `dist` — this hands over the write that has to be committed, and nothing else.
      - name: 📤 Upload regenerated manifests
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renovate-manifests
          path: packages/*/package.json
          if-no-files-found: error

  # The write half, and the only job in the repository that pushes. It runs no install, no build and no
  # Third-party code at all — it checks out, overlays the artifact and commits — so the `contents: write` token
  # Is never in the same job as anything a compromised dependency could reach.
  commit:
    name: Commit Manifests
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # The exact tree the manifests were generated against, not the branch tip, so the commit describes what
      # Was built. If Renovate has force-pushed since, the push below is rejected as a non-fast-forward and the
      # Run goes red rather than committing a record of a resolution that no longer exists.
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 📥 Download regenerated manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: renovate-manifests
          path: packages
      # `gitIgnoredAuthors` in `renovate.json` names this committer, so Renovate goes on managing a branch it
      # Lands on instead of abandoning it as modified by someone else. What no token here can do is re-run the
      # Checks: a push made with `GITHUB_TOKEN` starts no workflow, so the pushed head carries none and an
      # Automerge waiting on it waits for a status that will not arrive. The merge is a click, on the strength
      # Of the checks that ran one commit earlier against a tree differing only by fields no build reads.
      - name: 📌 Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- "packages/*/package.json"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): regenerate the manifest fields tsdown owns" -- "packages/*/package.json"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
