name: 🏎️ Bench
# Its own workflow rather than a 🏗️ CI job so it never blocks a merge: the committed `*.bench.md` stay the offline
# walltime gate, and this only proves every `*.bench.ts` still executes.

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same reusable workflow 🏗️ CI calls, so a build of this content by either warms the cache for the other
  build-packages:
    uses: ./.github/workflows/build-packages.yaml

  bench:
    name: Bench
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
      # `bench:ci`, not `bench`: one root `vitest bench --run` over every project's `*.bench.ts` in one process,
      # where `pnpm bench` is each member's own run in turn. The reporter rewrites `*.bench.md` on runner disk;
      # nothing commits it. Unsharded because a smoke test gains nothing from splitting but repeated setup.
      #
      # `scripts/src/workspace/buildPackages.bench.ts` opts out on `CI` itself: it measures cold builds by
      # deleting each `dist` — here the `package-builds` artifact just downloaded, including the reporter this
      # run writes through.
      - name: 🏎️ Run benchmarks
        run: pnpm bench:ci
