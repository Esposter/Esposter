name: 🏎️ Bench

# Benchmarks run as their own workflow (not part of 🏗️ CI) so they never block merges — they're a
# nice-to-have signal, not a required check. The committed `*.bench.md` stay the offline walltime gate; this
# workflow only proves every `*.bench.ts` still executes. Packages are built once by the shared
# `build-packages` reusable workflow and handed to the bench job as the `package-builds` artifact.
# Artifacts are run-scoped, but that reusable workflow's `actions/cache` key is shared repo-wide, so a 🏗️ CI
# build of the same content warms the cache here for free (and vice versa).
on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build every non-app package once via the shared reusable workflow (same content-hash cache key as 🏗️ CI, so
  # a CI build of the same content lets this skip the build). The `bench` job below `needs` this and pulls the
  # `package-builds` artifact through `setup-packages` instead of rebuilding inline.
  build-packages:
    uses: ./.github/workflows/build-packages.yaml

  bench:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
      # A bare root `vitest bench --run` discovers every project's `*.bench.ts` (packages/* + the scripts
      # project, per the root vitest.config.ts `projects`) as one file set and runs it in one process, where the
      # `pnpm bench` root script (`vitest bench --project scripts && pnpm -r run bench`) is a chain of several.
      # Local `pnpm bench` — the committed `*.bench.md` gate — uses the script. The BenchmarkMarkdownReporter
      # rewrites `*.bench.md` beside each bench on ephemeral runner disk; nothing commits it, so the committed
      # artifacts are untouched. Unsharded: this job is a smoke test that every bench still executes, so the
      # only thing splitting it buys is runner minutes spent on setup.
      #
      # One bench opts out of this job rather than being excluded here: `scripts/buildPackages.bench.ts` measures
      # cold package builds, which means deleting each `dist` — on this runner that is the `package-builds`
      # artifact `setup-packages` just downloaded, including the `@esposter/shared-node` reporter this very run
      # writes its results through. It skips on `CI`, and says so in the file.
      - name: 🏎️ Run benchmarks
        run: pnpm exec vitest bench --run
