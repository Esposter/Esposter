name: 🏎️ Bench

# Benchmarks run as their own workflow (not part of 🏗️ CI) so they never block merges — they're a
# nice-to-have signal, not a required check. The committed `*.bench.md` stay the offline walltime gate.
# CodSpeed (dashboard uploads, PR regression comments, flamegraphs, and the walltime/memory modes on its
# bare-metal `codspeed-macro` runners) is REMOVED: the runs exceeded the free tier's 600 min/month, after which
# every upload fails and posts a red commit status. Plain `vitest bench` still runs here as a smoke signal that
# every `*.bench.ts` executes. Packages are built once by the shared `build-packages` reusable workflow and
# fanned out to every bench shard as the `package-builds` artifact. Artifacts are run-scoped, but that reusable
# workflow's `actions/cache` key is shared repo-wide, so a 🏗️ CI build of the same content warms the cache here
# for free (and vice versa).
on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build every non-app package once via the shared reusable workflow (same content-hash cache key as 🏗️ CI, so
  # a CI build of the same content lets this skip the build). The `bench` shards below `needs` this and pull the
  # `package-builds` artifact through `setup-packages` instead of each rebuilding inline.
  build-packages:
    uses: ./.github/workflows/build-packages.yaml

  bench:
    name: Bench (${{ matrix.shard }}/8)
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Node pin: the Node-24 pin existed only for @codspeed/core's prebuilt native addon (V8 symbol removed in
      # Node 25+); without CODSPEED_ENV the codspeed plugin never loads, so the repo default Node is fine.
      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
      # A bare root `vitest bench --run` discovers every project's `*.bench.ts` (packages/* + the scripts
      # project, per the root vitest.config.ts `projects`) as one file set, so `--shard=i/8` partitions that
      # global set across runners. CI uses this bare sharded invocation rather than the `pnpm bench` root script
      # (`vitest bench --project scripts && pnpm -r run bench`) because that script is a multi-invocation chain a
      # single `--shard` can't span; local `pnpm bench` (the committed `*.bench.md` gate) uses the script. The
      # BenchmarkMarkdownReporter rewrites `*.bench.md` beside each bench on ephemeral runner disk — nothing
      # commits it, so the committed artifacts are untouched.
      - name: 🏎️ Run benchmarks
        run: pnpm exec vitest bench --run --shard=${{ matrix.shard }}/8
