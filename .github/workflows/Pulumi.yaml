name: 🏗️ Pulumi

on:
  pull_request:
    paths:
      - "packages/infra/**"
      - ".github/workflows/Pulumi.yaml"
      - ".github/actions/setup-project-dependencies/**"
      - ".github/actions/get-build-cache-keys/**"
      - ".github/actions/verify-package-builds/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      # 🏗️ CI already built every non-app package at this content hash and saved it under this key, and
      # `@esposter/infra`'s build is a subset of that — so on a hit this job builds nothing. Restore only: this
      # job builds a subset, so saving from here would publish a partial `dist` set under the full build's key.
      - name: 🔑 Get build cache keys
        id: keys
        uses: ./.github/actions/get-build-cache-keys

      - name: ♻️ Restore package builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.package-builds-paths }}
          key: package-builds-${{ steps.keys.outputs.package-builds-hash }}

      - name: 📦 Install dependencies
        run: pnpm --filter @esposter/infra... i
      # Gated on the build output rather than on the restore's `cache-hit`: that flag reports the entry the cache
      # Found, not what it extracted, so a `path` list that drifted from the save's reports a hit while a build
      # Skipped on it hands Pulumi an empty program. Every building package's `dist` is read rather than this
      # One's `dist/index.js` — a partial extract satisfies a single-file probe exactly when it should not.
      - name: 🔍 Verify package builds
        id: verify
        uses: ./.github/actions/verify-package-builds

      - name: 🏗️ Build
        if: steps.verify.outputs.complete != 'true'
        run: pnpm --filter @esposter/infra... build

      - name: 🔍 Pulumi Preview
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: preview
          stack-name: prod
          work-dir: packages/infra
          comment-on-pr: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
