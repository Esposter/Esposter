name: 🏗️ CI
# The job shape and the traced task cache behind the builds and the checks are
# `openspec/specs/architecture/monorepo-tooling/design.md` → `## CI job shape`. Comments here keep only what
# that page does not say.

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

# A newer push cancels the run in progress on every branch, so only the newest push's run finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared with 🏎️ Bench; the job id stays `build-packages` so every `needs:` below reads unchanged
  build-packages:
    uses: ./.github/workflows/build-packages.yaml

  build:
    name: Build App
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
        with:
          filter: "@esposter/web..."
      # Uncached: a replay needs the app's `.output` carried in the cache, which costs more than it saves
      # (`openspec/specs/architecture/vite-plus/design.md` → Rejected)
      - name: 🏗️ Build app
        run: pnpm -C apps/web build
      # The Worker's code is capped at 64 MiB uncompressed, so the server bundle is summed against that cap after each build
      - name: 📏 Check the server bundle size
        run: pnpm -C scripts server-bundle:check

  coverage:
    name: Coverage
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
      # Two suites assert against a built bundle: the Functions package counts the `app.*` registrations in its
      # `dist`, and the bundle-size record holds both apps' bundles. The `package-builds` artifact holds libraries only,
      # so they are built here, from the source this shard checked out.
      - name: 🏗️ Build the app bundles the suite asserts against
        run: pnpm --filter "@esposter/functions" --filter "@esposter/infra" build
      # Restored only: `build-packages` fills and saves the mirror under this key before a shard starts on the default
      # branch and `ai/queue`; another branch restores the newest mirror it can see (monorepo-tooling.md → ## CI job shape)
      - name: ♻️ Restore the game data mirror
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Esposter/cache/content
          key: game-data-mirror-${{ hashFiles('packages/genshin-world/src/generated/gameDataLock.json') }}
          restore-keys: game-data-mirror-
      # `default` beside `blob`, on purpose (monorepo-tooling.md → ## CI job shape)
      - name: 🧪 Test
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm coverage --reporter=default --reporter=blob --shard="$SHARD"

      - name: 📤 Upload blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest/blob/*
          if-no-files-found: error
          include-hidden-files: true

  coverage-merge:
    name: Merge Coverage
    needs: [build-packages, coverage]
    # A skipped job satisfies its required check, so the aggregate gate must run when a shard failed —
    # `!cancelled()` rather than `always()` so a cancelled run still reads as cancelled
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # `needs.*.result` covers the shard matrix as a whole — one shard that did not succeed fails the aggregate
      - name: 🚦 Gate on the shard results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: 📥 Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .vitest/blob
          pattern: coverage-blob-*
          merge-multiple: true
      # Re-emits the report from the blobs; no test runs again
      - name: 🧪 Merge coverage
        run: pnpm coverage --merge-reports

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

  # No `needs`: oxfmt is a standalone binary over source files, so it waits on no build
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies
      # The root project alone — where `vite-plus` and the lockfile-pinned `oxfmt` it runs are declared — and no
      # scripts. Not a global or `dlx` install: a formatter's version is its output, and a second source of truth for
      # it drifts from the lockfile until this check and `pnpm format` disagree.
      - name: 📦 Install dependencies
        run: pnpm --filter "{.}" i --ignore-scripts

      # Like the checks below, a hit restores nothing: the replay is the verdict that this exact tree already formatted
      - name: 📝 Format
        uses: ./.github/actions/run-cached-task
        with:
          task: format:check

  # Each entry's `name` is the check context the branch ruleset requires
  # (`apps/infra/src/github/rulesets/queueStatusChecks.ts`)
  check:
    name: ${{ matrix.name }}
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            task: lint
          - name: Typecheck
            task: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      # Like the app build, a hit restores nothing: the replay is the verdict that this exact tree already passed
      - name: ✅ ${{ matrix.name }}
        uses: ./.github/actions/run-cached-task
        with:
          task: ${{ matrix.task }}

  # After every check, on `main` and `ai/queue`: `ai/queue` deploys the dev environment and `main` the prod one, which
  # the branch picks the way the Deploy Function App workflow's maps do. A newer push cancels a run in progress, this
  # job included, so a deploy can be cut short.
  deploy:
    name: Deploy
    needs: [build, check, coverage-merge, format]
    if: ${{ github.ref_name == 'main' || github.ref_name == 'ai/queue' }}
    runs-on: ubuntu-latest
    env:
      # Nitro reads it while building the web Worker, and wrangler reads it to pick the environment each Worker deploys to
      CLOUDFLARE_ENV: ${{ fromJSON('{"ai/queue":"dev","main":"prod"}')[github.ref_name] }}
      # The build writes these into the web Worker's runtime config and wrangler vars, so they are set before it runs. The
      # origins are each environment's hostnames, as the naming conventions give them
      BASE_URL: ${{ fromJSON('{"ai/queue":"https://dev.esposter.com","main":"https://esposter.com"}')[github.ref_name] }}
      PUBLIC_ASSETS_BASE_URL: ${{ fromJSON('{"ai/queue":"https://assets.dev.esposter.com","main":"https://assets.esposter.com"}')[github.ref_name] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      # Installs the CLI only, since no `command` is given, so the secrets below are read with `pulumi env get`
      - name: 🔧 Install the Pulumi CLI
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      # Two values the web build bakes into its client and server runtime config, so they must exist before the build. Each
      # is also a Worker secret, put by the step after its Worker deploys. The list is `build` in worker-secrets.json
      - name: 🔐 Read the build's public configuration
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for name in $(jq -r '.build[]' .github/worker-secrets.json); do
            value="$(pulumi env get esposter-infra/prod "pulumiConfig.esposter-infra:${CLOUDFLARE_ENV}_${name}" --value string --show-secrets)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: 🏗️ Build the web app
        uses: ./.github/actions/build-app
        with:
          package: "@esposter/web"

      - name: 🏗️ Build the functions Worker
        uses: ./.github/actions/build-app
        with:
          package: "@esposter/functions"

      - name: 🚀 Deploy the web Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm -C apps/web deploy:worker

      # After its deploy, since `wrangler secret bulk` writes to a Worker that must already exist
      - name: 🔐 Put the web Worker's secrets
        uses: ./.github/actions/put-worker-secrets
        with:
          worker: web
          directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: 🚀 Deploy the functions Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm -C apps/functions deploy:worker

      - name: 🔐 Put the functions Worker's secrets
        uses: ./.github/actions/put-worker-secrets
        with:
          worker: functions
          directory: apps/functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: 🗄️ Apply the D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm -C apps/functions db:migrate:d1
