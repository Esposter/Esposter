name: 🏗️ CI
# The job shape and the traced task cache behind the builds and the checks are
# `openspec/specs/architecture/monorepo-tooling/design.md` → `## CI job shape`. Comments here keep only what
# that page does not say.

on:
  push:
    # `main` only takes commits `ai/queue` already runs (monorepo-tooling.md → ### What a CI proposal has to beat)
    branches-ignore:
      - main

permissions:
  contents: read

# A newer push cancels an older run, except on `ai/queue`: the sessions push it every few minutes, longer than one run
# takes, so cancelling left no run on it to finish. There the running run finishes and only the newest waiting one is kept,
# so the queue gets a verdict about once a run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/ai/queue' }}

jobs:
  # Shared with 🏎️ Bench; the job id stays `build-packages` so every `needs:` below reads unchanged
  build-packages:
    uses: ./.github/workflows/build-packages.yaml

  build:
    name: Build App
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
        with:
          filter: "@esposter/web..."
      # A replay restores nothing — the task keeps no outputs — so a hit is the verdict alone: this exact tree, down
      # to the packages' built bytes, already built green
      - name: 🏗️ Build app
        uses: ./.github/actions/run-cached-task
        with:
          task: build:app

  coverage:
    name: Coverage
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
      # Two suites assert against a built bundle: the Functions package counts the `app.*` registrations in its
      # `dist`, and both apps snapshot their bundle's size. The `package-builds` artifact holds libraries only,
      # so they are built here, from the source this shard checked out.
      - name: 🏗️ Build the app bundles the suite asserts against
        run: pnpm --filter "@esposter/functions" --filter "@esposter/infra" build
      # Restored only: `build-packages` fills and saves the mirror under this key before a shard starts
      # (monorepo-tooling.md → ## CI job shape)
      - name: ♻️ Restore the game data mirror
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Esposter/cache/content
          key: game-data-mirror-${{ hashFiles('packages/genshin-world/src/generated/gameDataLock.json') }}
          restore-keys: game-data-mirror-
      # `default` beside `blob`, on purpose (monorepo-tooling.md → ## CI job shape)
      - name: 🧪 Test
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm coverage --reporter=default --reporter=blob --shard="$SHARD"

      - name: 📤 Upload blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest/blob/*
          if-no-files-found: error
          include-hidden-files: true

  coverage-merge:
    name: Merge Coverage
    needs: [build-packages, coverage]
    # A skipped job satisfies its required check, so the aggregate gate must run when a shard failed —
    # `!cancelled()` rather than `always()` so a cancelled run still reads as cancelled
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # `needs.*.result` covers the shard matrix as a whole — one shard that did not succeed fails the aggregate
      - name: 🚦 Gate on the shard results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: 📥 Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .vitest/blob
          pattern: coverage-blob-*
          merge-multiple: true
      # Re-emits the report from the blobs; no test runs again
      - name: 🧪 Merge coverage
        run: pnpm coverage --merge-reports

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

  # No `needs`: oxfmt is a standalone binary over source files, so it waits on no build
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies
      # The root project alone — where `vite-plus` and the lockfile-pinned `oxfmt` it runs are declared — and no
      # scripts. Not a global or `dlx` install: a formatter's version is its output, and a second source of truth for
      # it drifts from the lockfile until this check and `pnpm format` disagree.
      - name: 📦 Install dependencies
        run: pnpm --filter "{.}" i --ignore-scripts

      # Like the checks below, a hit restores nothing: the replay is the verdict that this exact tree already formatted
      - name: 📝 Format
        uses: ./.github/actions/run-cached-task
        with:
          task: format:check

  # The gate: the duplicate-code finder's workspace test holds the whole scan of its scopes to no finding, so a clone in
  # any scope fails here. The finder runs jscpd itself with the scopes, globs and minimums its constants hold
  duplicate-code:
    name: Duplicate Code
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: 🔍 Duplicate code
        run: pnpm -C scripts exec vitest run src/workspace/duplicateCode.test.ts

  # Each entry's `name` is the check context the branch ruleset requires
  # (`apps/infra/src/github/rulesets/queueStatusChecks.ts`)
  check:
    name: ${{ matrix.name }}
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            task: lint
          - name: Typecheck
            task: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      # Like the app build, a hit restores nothing: the replay is the verdict that this exact tree already passed
      - name: ✅ ${{ matrix.name }}
        uses: ./.github/actions/run-cached-task
        with:
          task: ${{ matrix.task }}
