name: 🏗️ CI
# The job shape, the two content-hash caches and why every gate reads the disk rather than `cache-hit` are
# `apps/web/content/docs/architecture/monorepo-tooling.md` → `## CI job shape`. Comments here keep only what
# that page does not say.

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared with 🏎️ Bench; the job id stays `build-packages` so every `needs:` below reads unchanged
  build-packages:
    uses: ./.github/workflows/build-packages.yaml

  build:
    name: Build App
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The keys come from tracked files, so they are computed before any install: on a hit nothing below runs
      - name: 🔑 Get build cache keys
        id: keys
        uses: ./.github/actions/get-build-cache-keys

      - name: ♻️ Restore app build marker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .app-build-marker
          key: ${{ steps.keys.outputs.app-build-key }}
      # Gated on the marker file rather than `cache-hit`: a hit whose `path` drifted extracts nothing and still
      # reports success. A literal path, so the leading dot is the ordinary character it is.
      - name: 🔧 Setup Project Dependencies
        if: ${{ hashFiles('.app-build-marker') == '' }}
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        if: ${{ hashFiles('.app-build-marker') == '' }}
        uses: ./.github/actions/setup-packages
        with:
          filter: "@esposter/web..."
      # The marker is written only after the build returns, so a failed build leaves the post-run save nothing
      - name: 🏗️ Build app
        if: ${{ hashFiles('.app-build-marker') == '' }}
        env:
          APP_BUILD_KEY: ${{ steps.keys.outputs.app-build-key }}
        run: |
          pnpm -C apps/web build
          echo "$APP_BUILD_KEY" > .app-build-marker

  # @TODO: https://github.com/TypeStrong/typedoc/issues/3098 — restore this job once TypeDoc runs on TypeScript 7,
  # or a `typescript-native-bridge` build carries the AST navigation API; `pnpm build:docs` is the probe. Commented
  # out, not deleted: TypeDoc's `attachUnionComments` walks the syntax tree through `declaration.type.getChildAt`,
  # which the bridge's nodes do not carry, so every run exits 6 on the first union type alias. A
  # `typedoc>typescript` override cannot buy its way out — `typescript` is TypeDoc's peer, so it resolves from the
  # root context the alias owns.
  # build-docs:
  #   name: Build Documentation
  #   needs: build-packages
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: 📥 Checkout
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #
  #     - name: 🔧 Setup Project Dependencies
  #       uses: ./.github/actions/setup-project-dependencies
  #
  #     - name: 📦 Setup Packages
  #       uses: ./.github/actions/setup-packages
  #
  #     - name: 🏗️ Build documentation
  #       run: pnpm build:docs

  coverage:
    name: Coverage
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # ubuntu-26.04, not ubuntu-latest: the virrun os-backend suites need bubblewrap >= 0.10.0 (RAM overlay) and
    # 24.04 ships 0.9.0 — on the older image the differential tests self-gate via describe.skipIf and the
    # correctness gate silently disappears.
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bubblewrap is installed for the suites that test virrun's os backend, but vitest itself runs natively:
      # inside bwrap, isOsBackendSupported() cannot spawn its nested bwrap+overlay probe, and those suites
      # would self-gate away through describe.skipIf
      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies
        with:
          bubblewrap-sandbox: true

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
      # Two suites assert against a built bundle: the Functions package counts the `app.*` registrations in its
      # `dist`, and both apps snapshot their bundle's size. The `package-builds` artifact holds libraries only,
      # so they are built here, from the source this shard checked out.
      - name: 🏗️ Build the app bundles the suite asserts against
        run: pnpm --filter "@esposter/functions" --filter "@esposter/infra" build
      # `default` beside `blob`: the blob reporter alone prints only where it wrote, hiding why a shard failed
      - name: 🧪 Test
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm coverage --reporter=default --reporter=blob --shard="$SHARD"

      - name: 📤 Upload blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest/blob/*
          if-no-files-found: error
          include-hidden-files: true

  coverage-merge:
    name: Merge Coverage
    needs: [build-packages, coverage]
    # A skipped job satisfies its required check, so the aggregate gate must run when a shard failed —
    # `!cancelled()` rather than `always()` so a cancelled run still reads as cancelled
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # `needs.*.result` covers the shard matrix as a whole — one failing shard fails the aggregate
      - name: 🚦 Gate on the shard results
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: 📥 Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .vitest/blob
          pattern: coverage-blob-*
          merge-multiple: true
      # Re-emits the report from the blobs; no test runs again
      - name: 🧪 Merge coverage
        run: pnpm coverage --merge-reports

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

  # No `needs`: oxfmt is a standalone binary over source files, so it waits on no build
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies
      # The root project alone — where the lockfile-pinned `oxfmt` binary is declared — and no scripts. Not
      # `{.}...`: that closure provisions `virrun`, and this check is native by design. Not a global or `dlx`
      # install either: a formatter's version is its output, and a second source of truth for it drifts from
      # the lockfile until this check and `pnpm format` disagree.
      - name: 📦 Install dependencies
        run: pnpm --filter "{.}" i --ignore-scripts

      - name: 📝 Format
        run: pnpm format:check

  # Each entry's `name` is the check context the branch ruleset requires
  # (`apps/infra/src/github/rulesets/developMainStatusChecks.ts`)
  check:
    name: ${{ matrix.name }}
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            script: lint
          - name: Typecheck
            script: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: ✅ ${{ matrix.name }}
        env:
          SCRIPT: ${{ matrix.script }}
        run: pnpm "$SCRIPT"
