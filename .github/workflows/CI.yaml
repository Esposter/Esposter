name: 🏗️ CI
# The job shape and the traced task cache behind the builds and the checks are
# `openspec/specs/architecture/monorepo-tooling/design.md` → `## CI job shape`. Comments here keep only what
# that page does not say.

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

# Each job's `timeout-minutes` is several times its longest run, so a hang there frees the branch instead of holding it for hours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/ai/queue' }}

jobs:
  # Shared with 🏎️ Bench; the job id stays `build-packages` so every `needs:` below reads unchanged
  build-packages:
    uses: ./.github/workflows/build-packages.yaml

  build:
    name: Build App
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
        with:
          filter: "@esposter/web..."
      # Uncached (`openspec/specs/architecture/vite-plus/design.md` → Rejected)
      - name: 🏗️ Build app
        run: pnpm -C apps/web build
      # The Worker's code is capped at 64 MiB uncompressed, so the server bundle is summed against that cap after each build
      - name: 📏 Check the server bundle size
        run: pnpm -C scripts server-bundle:check

  # One copy of the durations the last run recorded, handed to every shard: each shard splits the files by them, and a
  # Shard that restored a newer save than its siblings would split differently, running a file twice or never
  test-timings:
    name: Test Timings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ♻️ Restore the test timings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vitest/timings.json
          key: vitest-timings-${{ github.sha }}
          restore-keys: vitest-timings-
      - name: 📤 Upload the test timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-timings
          path: .vitest/timings.json
          if-no-files-found: ignore
          include-hidden-files: true

  coverage:
    name: Coverage
    needs: [build-packages, test-timings]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
      # The bundle-size record holds the infrastructure program's bundle. The `package-builds` artifact holds libraries
      # only, so it is built here, from the source this shard checked out.
      - name: 🏗️ Build the app bundles the suite asserts against
        run: pnpm --filter "@esposter/infra" build
      # Restored only: `build-packages` fills and saves the mirror under this key before a shard starts on the default
      # branch and `ai/queue`; another branch restores the newest mirror it can see (openspec/specs/architecture/monorepo-tooling/design.md → ## CI job shape)
      - name: 🔑 Key the game data mirror
        id: game-data-mirror-key
        uses: ./.github/actions/game-data-mirror-key
      - name: ♻️ Restore the game data mirror
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/workspace-data/content
          key: ${{ steps.game-data-mirror-key.outputs.key }}
          restore-keys: game-data-mirror-
      # One copy for every shard, which `coverage-merge` saves (`openspec/specs/architecture/ci-caches/design.md`)
      - name: ♻️ Restore the Vitest module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: vitest-module-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: vitest-module-cache-${{ hashFiles('pnpm-lock.yaml') }}-
      # None on a first run or after an eviction, when the shards split by hash
      - name: 📥 Download the test timings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .vitest
          pattern: vitest-timings
          merge-multiple: true
      # `default` beside `blob`, on purpose (openspec/specs/architecture/monorepo-tooling/design.md → ## CI job shape).
      # The timings reporter writes this shard's durations into `.vitest/timings/`, which the upload below sends on to `coverage-merge`, where they are merged into `.vitest/timings.json`
      - name: 🧪 Test
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm coverage --reporter=default --reporter=blob --reporter=./packages/configuration/src/services/TestTimingsReporter.ts --shard="$SHARD"
      # Read only by this run's `coverage-merge`, so only the saving branches upload it, and it expires after a day. Uploaded
      # even when the suite failed
      - name: 📤 Upload the Vitest module cache
        if: ${{ !cancelled() && (github.ref_name == 'main' || github.ref_name == 'ai/queue') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-module-cache-${{ matrix.shard }}
          path: node_modules/.vitest-cache/*
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1

      - name: 📤 Upload blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest/blob/*
          if-no-files-found: error
          include-hidden-files: true

      # The wake check's records are merged in `coverage-merge`, since a sharded run sees only some of the suites
      - name: 📤 Upload wake-check records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wake-check-${{ matrix.shard }}
          path: .vitest/wake-check/*
          if-no-files-found: error
          include-hidden-files: true

      - name: 📤 Upload the test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-timings-${{ matrix.shard }}
          path: .vitest/timings/*
          if-no-files-found: error
          include-hidden-files: true

  coverage-merge:
    name: Merge Coverage
    needs: [build-packages, coverage]
    # A skipped job satisfies its required check, so the aggregate gate must run when a shard failed —
    # `!cancelled()` rather than `always()` so a cancelled run still reads as cancelled
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Ahead of the gate, so the module cache saved at the end can key on the lockfile when the gate fails the job
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `needs.*.result` covers the shard matrix as a whole — one shard that did not succeed fails the aggregate
      - name: 🚦 Gate on the shard results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: 📥 Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .vitest/blob
          pattern: coverage-blob-*
          merge-multiple: true
      - name: 📥 Download wake-check records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .vitest/wake-check
          pattern: wake-check-*
          merge-multiple: true
      # Over the records of every shard together: a procedure no shard calls is a gap that no single shard can see
      - name: 🚦 Gate on the wake check's gaps
        run: pnpm -C scripts wake-check:gaps
      # Re-emits the report from the blobs; no test runs again
      - name: 🧪 Merge coverage
        run: pnpm coverage --merge-reports

      - name: 📥 Download the test timings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .vitest/timings
          pattern: vitest-timings-*
          merge-multiple: true
      # Each file ran on one shard, so a deep merge of the shards' records holds every file once
      - name: 📋 Merge the test timings
        run: jq -s 'reduce .[] as $timings ({}; . * $timings)' .vitest/timings/*.json > .vitest/timings.json
      - name: 💾 Save the test timings
        if: ${{ github.ref_name == 'main' || github.ref_name == 'ai/queue' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vitest/timings.json
          key: vitest-timings-${{ github.sha }}

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

      # `!cancelled()` so the union is still saved after a failed gate. The union waits on this step's outcome, so a failed
      # download saves nothing
      - name: 📥 Download the Vitest module cache
        id: vitest-module-cache-download
        if: ${{ !cancelled() && (github.ref_name == 'main' || github.ref_name == 'ai/queue') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .vitest/module-cache
          pattern: vitest-module-cache-*
      # Content-named entries copy over one another, a batch of files at a time; only the `_manifest-*.json` files are
      # merged, as the timings are
      - name: 📋 Union the Vitest module cache
        id: vitest-module-cache-union
        if: ${{ steps.vitest-module-cache-download.outcome == 'success' && (github.ref_name == 'main' || github.ref_name == 'ai/queue') }}
        run: |
          # Nothing uploaded, as on a re-run after the uploads expired: the cache stays as it is
          if [ -z "$(find .vitest/module-cache -type f 2>/dev/null)" ]; then
            exit 0
          fi
          mkdir -p node_modules/.vitest-cache
          find .vitest/module-cache -type f ! -name '_manifest-*' -exec sh -c 'cp "$@" node_modules/.vitest-cache/' sh {} +
          for name in $(find .vitest/module-cache -type f -name '_manifest-*' -exec basename {} \; | sort -u); do
            jq -s 'reduce .[] as $manifest ({}; . * $manifest)' $(find .vitest/module-cache -type f -name "$name") > "node_modules/.vitest-cache/$name"
          done
          echo "unioned=true" >> "$GITHUB_OUTPUT"
      - name: 💾 Save the Vitest module cache
        if: ${{ steps.vitest-module-cache-union.outputs.unioned == 'true' && (github.ref_name == 'main' || github.ref_name == 'ai/queue') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: vitest-module-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # No `needs`: oxfmt is a standalone binary over source files, so it waits on no build
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies
      # The root project alone — where `vite-plus` and the lockfile-pinned `oxfmt` it runs are declared — and no
      # scripts. Not a global or `dlx` install: a formatter's version is its output, and a second source of truth for
      # it drifts from the lockfile until this check and `pnpm format` disagree.
      - name: 📦 Install dependencies
        run: pnpm --filter "{.}" i --ignore-scripts

      - name: 📝 Format
        uses: ./.github/actions/run-cached-task
        with:
          task: format:check

  # Each entry's `name` is the check context the branch ruleset requires
  # (`apps/infra/src/github/rulesets/queueStatusChecks.ts`)
  check:
    name: ${{ matrix.name }}
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            task: lint
          - name: Typecheck
            task: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: ✅ ${{ matrix.name }}
        uses: ./.github/actions/run-cached-task
        with:
          task: ${{ matrix.task }}
