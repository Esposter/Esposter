name: 🏗️ CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

# `pnpm -r` interleaves the packages it runs concurrently, so a failure's stack arrives spliced with another
# package's output. Live interleaved output is what a local run wants — a watched terminal, one failure at a time —
# while a log read after the fact wants each package contiguous. Same scripts either way: this is the only place the
# difference is stated, and pnpm reads its settings from `PNPM_CONFIG_<SETTING>` (`npm_config_*` is not read).
env:
  PNPM_CONFIG_AGGREGATE_OUTPUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build every non-app package once and publish the `package-builds` artifact. Extracted into a reusable
  # workflow so 🏗️ CI and 🏎️ Bench share one definition + one content-hash cache key (a build from either
  # workflow warms the cache for the other). The job id stays `build-packages`, so every `needs: build-packages`
  # below is unchanged.
  build-packages:
    uses: ./.github/workflows/build-packages.yaml

  build:
    name: Build App
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job is the workflow's critical path — several times the next-longest — and the only build here that
      # Was paid on every push. What it produces is a verdict rather than an artifact: nothing downstream reads
      # `.output`, no deploy takes it, so the only thing worth carrying across runs is the fact that this exact
      # Tree built green. That is what the marker is, and it is why the key may be an app-wide content hash:
      # A hit means the identical source already built, so the build has nothing left to say.
      #
      # The key comes from the same action that keys `package-builds`, over the same inputs plus `packages/app`
      # — so a change to a package this app bundles moves it too, and the two caches can never disagree about
      # What the tree is.
      - name: 🔑 Get build cache keys
        id: keys
        uses: ./.github/actions/get-build-cache-keys

      - name: ♻️ Restore app build marker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .app-build-marker
          key: app-build-${{ steps.keys.outputs.app-build-hash }}
      # Every step below hangs off the marker's absence, in this order: the key is computed from tracked files
      # With `git ls-tree`, so a hit needs neither `node_modules` nor the `package-builds` artifact, and an
      # Install nothing goes on to use is latency on the job the whole workflow finishes behind.
      #
      # Gated on the marker itself rather than on the restore's `cache-hit`, as everywhere else here: a hit whose
      # `path` no longer matches what was saved reports success and extracts nothing, and a build skipped on that
      # Flag would report green having built nothing at all. A literal path rather than a glob, so the leading
      # Dot is matched as the ordinary character it is.
      #
      # The platform-branched virrun.config.ts resolves the native backend on Linux, so `virrun --` is a passthrough
      # Here: `pnpm i` (warm pnpm store cache) provisions node_modules and its `postinstall: nuxt prepare` generates
      # The platform-correct Linux `.nuxt` in place — no sandbox, no bubblewrap, no warm overlay layers.
      - name: 🔧 Setup Project Dependencies
        if: ${{ hashFiles('.app-build-marker') == '' }}
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        if: ${{ hashFiles('.app-build-marker') == '' }}
        uses: ./.github/actions/setup-packages
      # The marker is written only after the build returns, so a failed build leaves nothing for the post-run
      # Save to find and the next push rebuilds. It holds the hash it was saved under, which is the only thing
      # A restored marker can be read for.
      - name: 🏗️ Build app
        if: ${{ hashFiles('.app-build-marker') == '' }}
        env:
          APP_BUILD_HASH: ${{ steps.keys.outputs.app-build-hash }}
        run: |
          pnpm build:app
          echo "$APP_BUILD_HASH" > .app-build-marker

  # @TODO: Commented out, not deleted: TypeDoc cannot run against the `typescript-native-bridge` alias. Its
  # `attachUnionComments` walks the syntax tree through `declaration.type.getChildAt`, which the bridge's nodes do
  # Not carry, so every run exits 6 on the first union type alias. A `typedoc>typescript` override cannot buy its
  # Way out — `typescript` is TypeDoc's peer, so it resolves from the root context the alias owns. Restore this
  # Job when a bridge build grows the AST navigation API; `pnpm build:docs` is the probe.
  # build-docs:
  #   name: Build Documentation
  #   needs: build-packages
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: 📥 Checkout
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #
  #     - name: 🔧 Setup Project Dependencies
  #       uses: ./.github/actions/setup-project-dependencies
  #
  #     - name: 📦 Setup Packages
  #       uses: ./.github/actions/setup-packages
  #
  #     - name: 🏗️ Build documentation
  #       run: pnpm build:docs

  coverage:
    name: Coverage
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # ubuntu-26.04, not ubuntu-latest: the virrun os-backend suites need bubblewrap >= 0.10.0 (RAM overlay) and
    # 24.04 ships 0.9.0 — on the older image the differential tests self-gate via describe.skipIf and the
    # correctness gate silently disappears.
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test suite itself exercises virrun's os backend (createOsBackend tests self-gate on bwrap), so the
      # Sandbox must be installed here — but vitest runs natively below, NOT through virrun. Routing coverage through
      # virrun would run the suite *inside* bwrap, and isOsBackendSupported() probes by spawning a nested
      # bwrap+overlay, which unprivileged userns rejects → the os-backend differential tests silently skip via
      # describe.skipIf, deleting the correctness gate. Coverage stays native to keep that gate live.
      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies
        with:
          bubblewrap-sandbox: true

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages
      # `--shard=i/n` runs a distinct slice of ALL test files (every package + scripts, via the root
      # Vitest `projects` config) on this runner; `--reporter=blob` serialises this shard's results and
      # Coverage data (vitest writes the per-shard `.vitest-reports/blob-i-n.json`) for the merge job.
      # `--reporter=blob` serialises this shard's results + coverage for the merge job. We pair it with
      # `--reporter=default` so failing tests / unhandled errors are also printed to the console — the
      # blob reporter alone writes only the file and prints nothing, hiding why a shard exits non-zero.
      - name: 🧪 Test
        run: pnpm exec vitest run --coverage --reporter=default --reporter=blob --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: 📤 Upload blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest-reports/*
          if-no-files-found: error
          include-hidden-files: true

  coverage-merge:
    name: Merge Coverage
    needs: [build-packages, coverage]
    # Runs even when a dependency failed, because a skipped job reports its required check as *satisfied* —
    # So without this the one gate that means "every shard passed" goes green precisely when a shard did not,
    # Which is how a dependency update once merged with a red suite. `!cancelled()` rather than `always()` so
    # A cancelled run still reads as cancelled instead of turning into a failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # First step, before any setup: turn a failed dependency into a failed check rather than a skipped one.
      # `needs.*.result` covers the shard matrix as a whole — one failing shard fails the aggregate.
      - name: 🚦 Gate on the shard results
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: 📥 Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .vitest-reports
          pattern: coverage-blob-*
          merge-multiple: true
      # Recombine the sharded runs into one report with unified coverage from the blob data —
      # This re-emits the report only, it does not re-run any tests.
      - name: 🧪 Merge coverage
        run: pnpm exec vitest run --merge-reports --coverage

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

  # The one check with no `needs: build-packages`. oxfmt is a standalone binary reading source files — no
  # Barrels, no package `dist`, and no `virrun` in the command to build one for — so gating it on the package
  # Build only made the workflow's quickest check wait out its slowest job. It installs rather than using
  # `setup-packages` for the same reason: it wants `node_modules`, not the built artifact.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      # `--ignore-scripts`, because the only thing this job needs out of the install is the lockfile-pinned
      # `oxfmt` binary. A plain install additionally runs the app's `postinstall: nuxt prepare` and every
      # `allowBuilds` native postinstall, none of which a formatter reading source files can observe — which
      # Put the workflow's quickest check behind its slowest install right after it stopped waiting on the
      # Package build. Installing oxfmt globally or through `dlx` would skip more still and is the wrong trade:
      # A formatter's version is its output, so a second source of truth for it drifts from the lockfile until
      # `format:check` here and `pnpm format` locally disagree — the exact failure this job exists to catch.
      - name: 📦 Install dependencies
        run: pnpm i --ignore-scripts

      - name: 📝 Format
        run: pnpm format:check

  lint:
    name: Lint
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: 🔍 Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Setup Packages
        uses: ./.github/actions/setup-packages

      - name: ✅ Typecheck
        run: pnpm typecheck
