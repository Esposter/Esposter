# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - prod-func-esposter-001

on:
  push:
    branches:
      - main

# Serialize deploys per branch but never cancel an in-flight deploy — a half-applied
# function deployment is worse than a stale one, so newer pushes queue behind the running deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FUNCTION_APP_NAME: prod-func-esposter-001
  OUTPUT_DIRECTORY: dist
  PACKAGE_PATH: packages/azure-functions
  RESOURCE_GROUP_NAME: prod-rg-esposter-ae-001
  STORAGE_ACCOUNT_NAME: prodstesposter001
  ZIP_FILE_NAME: release.zip

jobs:
  build-and-deploy:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔨 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      # 🏗️ CI already built every non-app package at this content hash and saved it under this key, and
      # `@esposter/azure-functions` is one of them — so on a hit this job builds nothing and deploys exactly the
      # Bundle CI checked. Restore only: this job builds a subset, so saving from here would publish a partial
      # `dist` set under the full build's key.
      - name: 🔑 Get build cache keys
        id: keys
        uses: ./.github/actions/get-build-cache-keys

      - name: ♻️ Restore package builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.package-builds-paths }}
          key: package-builds-${{ steps.keys.outputs.package-builds-hash }}

      - name: 🔧 Resolve Project Dependencies
        run: pnpm --filter @esposter/azure-functions... i
      # Gated on the build output rather than on the restore's `cache-hit`: that flag reports the entry the cache
      # Found, not what it extracted, so a `path` list that drifted from the save's reports a hit while a build
      # Skipped on it zips an empty `dist` and deploys a function app that registers nothing, with the host still
      # Reporting Running. Every building package's `dist` is read rather than this one's — a partial extract
      # Satisfies a single-file probe exactly when it should not.
      - name: 🔍 Verify package builds
        id: verify
        uses: ./.github/actions/verify-package-builds

      - name: 🏗️ Build
        if: steps.verify.outputs.complete != 'true'
        run: pnpm --filter @esposter/azure-functions... build

      - name: 📦 Collect Deployment Output
        run: |
          pnpm --filter @esposter/azure-functions deploy --prod ${{ env.OUTPUT_DIRECTORY }} --config.inject-workspace-packages=true --config.node-linker=hoisted
          cp ${{ env.PACKAGE_PATH }}/host.json ${{ env.OUTPUT_DIRECTORY }}/host.json

      - name: 📦 Zip Artifact for Deployment
        run: |
          pushd ${{ env.OUTPUT_DIRECTORY }}
          zip -r ../${{ env.ZIP_FILE_NAME }} . -x@.funcignore
          popd

      - name: 🔑 Azure CLI Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🌐 Get GitHub Runner IP
        id: get_ip
        run: echo runner_ip=$(curl -s ipinfo.io/ip) >> $GITHUB_OUTPUT

      - name: 📡 Allow Runner IP in Storage Account Firewall
        run: |
          az storage account network-rule add \
            --account-name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --ip-address ${{ steps.get_ip.outputs.runner_ip }}

      - name: 🚀 Upload Package to Blob Storage
        run: |
          az storage container create --account-name ${{ env.STORAGE_ACCOUNT_NAME }} --name ${{ env.FUNCTION_APP_NAME }} --auth-mode login --public-access off || true
          az storage blob upload --account-name ${{ env.STORAGE_ACCOUNT_NAME }} --container-name ${{ env.FUNCTION_APP_NAME }} --name ${{ env.ZIP_FILE_NAME }} --file ${{ env.ZIP_FILE_NAME }} --auth-mode login --overwrite

      - name: 📡 Remove Runner IP from Storage Account Firewall
        if: always() # This ensures the rule is removed even if deployment fails
        run: |
          az storage account network-rule remove \
            --account-name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --ip-address ${{ steps.get_ip.outputs.runner_ip }}
