name: ♻️ Review Collector

# The garbage collector of the review budget (docs: infra/review-collector): allocation and freeing run the same
# idempotent cycle. No `schedule` — every trigger is a webhook the platform delivers, and the one state change
# that sends none, a rate limit lifting, is the called workflow's `retrigger` job.
on:
  push:
    branches:
      - ai/queue
      # The return stroke: a release merging closes the pull request, so no review event carries `develop` forward
      - main
  pull_request_review:
    types:
      - submitted
  # The verdict is a commit status flipped a moment after the review body; listening to both ends of that gap
  # keeps a dropped delivery from parking the pipeline until the next push
  status:
  # The bot answers a retrigger with a comment or an edit of its walkthrough — never a review or a status
  issue_comment:
    types:
      - created
      - edited
  workflow_dispatch:
    inputs:
      force:
        description: Push the window even when the queue is under the fill target
        type: boolean
        default: false

# Nothing but the triggers and the two secrets the call reads: this is the one file GitHub reads from the event's
# own ref, so the one copy that cannot be pinned (the reusable workflow says why). Named rather than inherited so
# the drain's permission-skipping Claude session on the pinned `ai/queue` copy never holds the deployment
# credentials; the callee declares both `required` so a secret it grows and this file lacks fails the call.
permissions:
  contents: read
  actions: write

jobs:
  run:
    name: Run
    uses: Esposter/Esposter/.github/workflows/run-review-collector.yaml@ai/queue
    with:
      force: ${{ inputs.force == true }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEW_COLLECTOR_TOKEN: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
