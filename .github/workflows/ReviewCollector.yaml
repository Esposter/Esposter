name: ♻️ Review Collector

# The garbage collector of the review budget (docs: infra/review-collector): allocation and freeing run the same
# idempotent cycle. No `schedule` — every automatic trigger is a webhook the platform delivers (`workflow_dispatch`
# is the manual nudge), and the one state change that sends none, a rate limit lifting, is the called workflow's
# `retrigger` job.
on:
  push:
    branches:
      - ai/queue
      # The return stroke: a release merging closes the pull request, so no review event carries `develop` forward
      - main
  pull_request_review:
    types:
      - submitted
  # The release closing is a second delivery for the return stroke. Usually its push to `main` fires the cycle,
  # but this still re-reads the remote when that delivery is absent or delayed.
  pull_request:
    branches:
      - main
    types:
      - closed
  # A review's completion is a commit status flipped a moment after the review body; listening to both ends of that gap
  # keeps a dropped delivery from parking the pipeline until the next push
  status:
  # The bot answers a retrigger with a comment or an edit of its walkthrough — never a review or a status
  issue_comment:
    types:
      - created
      - edited
  # A red `main`: the release merges on the review alone, so what CI held lands on `main`, and the repairer answers
  # the verdict on the head — CI's checks, or the alerts CodeQL's gate turns red. `workflow_run` fires only from
  # the default branch's copy of this file, so the trigger waits for a release; the cycle reads the same verdict
  # on every event meanwhile.
  workflow_run:
    workflows:
      - 🏗️ CI
      - 🔎 CodeQL
    types:
      - completed
  workflow_dispatch:

# The triggers, the filter and the call: this is the one file GitHub reads from the event's own ref, so the one
# copy that cannot be pinned (the reusable workflow says why), and every line here is one that a copy a release
# behind must still agree with. `inherit` keeps the secrets out of that contract — a named list broke at startup
# the moment one side grew a secret the other had not seen — and narrows nothing: `CI.yaml` runs on every branch
# with the same repository secrets.
permissions:
  contents: read
  actions: write

jobs:
  run:
    name: Run
    # Only the bot's reviews of the release pull request, CodeRabbit's own status on a commit `develop` carries
    # (every deployment writes one against the same commits) and the bot's own comments run a cycle — the
    # collector's marker comments would otherwise wake the cycle that posted them. The status event needs the
    # branch as well as the context: the bot writes that status on every pull request it is asked about,
    # renovate's included, and a cycle woken by one only reaches the gates and exits, having paid for a runner,
    # an install and a clone to do it. A status payload lists every branch carrying its sha, not just the ones
    # heading it, so a status on a sha `develop` has already moved past still names it. A CI run's completion
    # runs a cycle only when it is `main`'s and red — the one conclusion the repairer answers; every other branch's
    # CI, and a green `main`, would pay for a runner to reach the gates and exit.
    #
    # The filter is here, and repeated on the job it guards, because the two answer different failures. Here,
    # because a run whose called job skips still takes the concurrency group's one pending slot and evicts the
    # real fire waiting in it — measured on this repository, a status fire cancelled by a `workflow_run` that
    # then skipped, and no cycle at all for eighteen minutes until an unrelated push woke one — where a caller
    # job that skips starts no called workflow and enters no group. There, because this is the copy that cannot
    # be pinned: a change to the filter reaches the events read from `main`'s copy a release later, and the
    # pinned copy is what filters them meanwhile. `eventFilter.test.ts` holds the two equal, which is what makes
    # the second copy skip nothing while they agree.
    if: >-
      (github.event_name != 'pull_request_review' ||
      (github.event.review.user.login == 'coderabbitai[bot]' && github.event.pull_request.head.ref == 'develop')) &&
      (github.event_name != 'pull_request' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == 'main')) &&
      (github.event_name != 'status' ||
      (github.event.context == 'CodeRabbit' && contains(github.event.branches.*.name, 'develop'))) &&
      (github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == 'coderabbitai[bot]' && github.event.issue.pull_request)) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure'))
    uses: Esposter/Esposter/.github/workflows/run-review-collector.yaml@ai/queue
    secrets: inherit
