name: ♻️ Review Collector

# The garbage collector of the review budget (docs: infra/review-collector). Allocation — the session pushing
# `queue` — and freeing — CodeRabbit finishing a review — run the same idempotent cycle, and the cycle's gates
# decide whether anything is done. There is deliberately no `schedule`: every one of these is a webhook the
# platform already delivers, and the one state change that sends none — a rate limit lifting — is answered by
# the `retrigger` job below, which waits out the deadline the bot itself publishes rather than asking on a timer.
on:
  push:
    branches:
      - queue
      # The return stroke. A release merging, or a dependency bump landing directly, both move `main`; the cycle
      # fast-forwards `develop` onto it when `develop` is an ancestor. The release pull request is closed by then,
      # so no review event will ever fire for it and this is the only thing that carries `develop` forward.
      - main
  pull_request_review:
    types:
      - submitted
  # CodeRabbit's verdict is a commit status (context `CodeRabbit`), and it flips it a moment after writing the
  # review body. Listening to both ends of that gap is what keeps a dropped `pull_request_review` delivery, or a
  # review that ends by status alone, from parking the pipeline until the session's next push.
  status:
  workflow_dispatch:
    inputs:
      force:
        description: Push the window even when the queue is under the fill target
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect:
    name: Collect
    # A review event fires for every review on every main-based pull request — renovate's included — and for
    # every batch of replies the bot answers. Only the bot's reviews of the release pull request run a cycle, and
    # only CodeRabbit's own status does: every deployment writes one of its own against the same commits.
    if: >-
      (github.event_name != 'pull_request_review' ||
      (github.event.review.user.login == 'coderabbitai[bot]' && github.event.pull_request.head.ref == 'develop')) &&
      (github.event_name != 'status' || github.event.context == 'CodeRabbit')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Every fire waits for the one ahead of it and re-reads the remote. The bot's own replies arrive as reviews,
    # so a drain is followed by several fires within seconds — each after the first exits at the gates. The group
    # is on the job rather than the workflow so the retrigger's wait never holds it.
    concurrency:
      group: review-collector
      cancel-in-progress: false
    outputs:
      retriggerDelaySeconds: ${{ steps.collect.outputs.retriggerDelaySeconds }}
      retriggerPullRequest: ${{ steps.collect.outputs.retriggerPullRequest }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The cycle ports across `develop`, `queue` and `review-fixes` with `git cherry`, which a shallow clone
          # cannot answer. The collector token rather than the built-in one: a push made with `GITHUB_TOKEN`
          # starts no workflow runs, so `develop`'s CI and deployment would never fire on a collector push.
          fetch-depth: 0
          token: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          # The drain runs a permission-skipping Claude session over review text it must not trust, in this very
          # checkout. A persisted credential would sit in `.git/config` where that session can spend it, so git
          # is authenticated through `gh` instead — which reads the token from an environment the drain's own
          # child process is not given (`runDrain`).
          persist-credentials: false

      - name: 🔧 Setup Project Dependencies
        uses: ./.github/actions/setup-project-dependencies

      - name: 📦 Install dependencies
        run: pnpm i

      # `scripts` imports `@esposter/shared` through its published entry, and a fresh checkout has no `dist`.
      # The closure selector builds the package and whatever workspace package it depends on.
      - name: 🏗️ Build the shared package
        run: pnpm --filter "@esposter/shared..." run build

      - name: 🪪 Identify the collector
        # `fileMode` off because the install marks a package's `bin` script executable, and on Linux that mode
        # flip alone reads as a dirty tree — which the collector refuses to work in.
        run: |
          git config user.name "Q16solver"
          git config user.email "Q16solver@users.noreply.github.com"
          git config core.fileMode false

      - name: 🤝 Trust the workspace
        # A fresh runner has no ~/.claude.json, so Claude Code treats the checkout as untrusted and ignores every
        # permissions.allow entry in .agents/settings.local.json. Pre-accepting the trust dialog silences that.
        run: |
          node -e '
            const fs = require("fs");
            const os = require("os");
            const path = require("path");
            const file = path.join(os.homedir(), ".claude.json");
            const config = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : {};
            config.projects ??= {};
            config.projects[process.env.GITHUB_WORKSPACE] ??= {};
            config.projects[process.env.GITHUB_WORKSPACE].hasTrustDialogAccepted = true;
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          '

      - name: ♻️ Collect
        id: collect
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          FORCE_FLAG: ${{ inputs.force == true && '--force' || '' }}
        # The flag is an array rather than a bare expansion: unquoted it fails shellcheck, and quoted it passes
        # an empty argument on every run that is not forced.
        run: |
          gh auth setup-git
          forceArguments=()
          if [[ -n "$FORCE_FLAG" ]]; then forceArguments+=("$FORCE_FLAG"); fi
          pnpm ai:coderabbit:collect "${forceArguments[@]}"

  # The one missing webhook, supplied. A rate limit lifts on CodeRabbit's clock and announces nothing when it
  # does, so the cycle reads the deadline the bot states — "Next included review available in N minutes" — and
  # this job sleeps it out and retriggers. The review that starts submits a `pull_request_review`, which is the
  # event the collector already runs on, so the pipeline resumes itself without anything polling for it.
  retrigger:
    name: Retrigger
    needs: collect
    if: needs.collect.outputs.retriggerDelaySeconds != ''
    runs-on: ubuntu-latest
    # The bot's own stated deadline can run past this — `RETRIGGER_DELAY_CAP_MS` (collect/constants.ts) is what
    # keeps the sleep below inside it, with margin for the runner to start and post the comment once it wakes.
    timeout-minutes: 90
    # Its own group: `collect` serialises the cycles, and a wait measured in the bot's minutes must not sit in
    # that queue holding back a session push. A newer run supersedes a pending one — it carries the newer
    # deadline, and the bot answers both retriggers identically anyway.
    concurrency:
      group: review-collector-retrigger
      cancel-in-progress: true
    steps:
      - name: ⏳ Wait out the rate limit
        env:
          DELAY_SECONDS: ${{ needs.collect.outputs.retriggerDelaySeconds }}
        run: sleep "$DELAY_SECONDS"

      # The retrigger is spelled out rather than read from `PROBE_COMMENT`, for the reason every literal a config
      # outside the TypeScript graph repeats: there is nothing here that can import it.
      - name: 🐇 Ask for the review the limit refused
        env:
          GH_TOKEN: ${{ secrets.REVIEW_COLLECTOR_TOKEN }}
          PULL_REQUEST: ${{ needs.collect.outputs.retriggerPullRequest }}
        run: gh pr comment "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --body "@coderabbitai review"
