name: Verify Package Builds
description: Fail when a library that builds has no output on disk after the build — a replay that restored too little, or a build that wrote too little, fails here by name instead of downstream as a missing module
runs:
  using: composite
  steps:
    # The set is discovered, not listed: a library builds if it has a tsdown config, so one added later is
    # covered with nothing edited. `dist` alone: it is the half that is deployed and published, so its absence is
    # the silent one — a missing barrel fails `typecheck` and `lint` by name.
    - name: 🔍 Verify package builds
      shell: bash
      run: |
        missingPackages=()
        for tsdownConfiguration in packages/*/tsdown.config.ts; do
          package="${tsdownConfiguration%/tsdown.config.ts}"
          [ -n "$(ls -A "$package/dist" 2>/dev/null)" ] || missingPackages+=("$package")
        done
        if [ ${#missingPackages[@]} -gt 0 ]; then
          echo "No dist for: ${missingPackages[*]}"
          exit 1
        fi
