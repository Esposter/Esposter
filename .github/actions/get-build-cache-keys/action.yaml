name: Get Build Cache Keys
description: Compute the content-hash keys of the package-builds and app-build caches, and the path list the package-builds entry is saved and restored with, shared by the workflows that save one and every workflow that restores one
outputs:
  app-build-key:
    description: The app-build cache key — a sha256 over every tracked file `pnpm -C apps/web build` could read, the package-builds inputs plus `apps/web`
    value: ${{ steps.keys.outputs.app-build-key }}
  package-builds-key:
    description: The package-builds cache key — a sha256 over every tracked file `pnpm build:packages` could read
    value: ${{ steps.keys.outputs.package-builds-key }}
  package-builds-paths:
    # `*/dist` is the build output and `*/src/**/index.ts` the ctix-generated barrels (gitignored). Libraries
    # only — an app's `dist` is deploy payload nothing imports — and their common ancestor `packages` is where
    # the artifact unpacks.
    description: The paths the package-builds cache entry and its artifact hold — every library's `dist` and the generated barrels
    value: |
      packages/*/dist
      packages/*/src/**/index.ts
runs:
  using: composite
  steps:
    # One definition for both halves of a cache entry's address, because both drift silently: a key that drifts
    # never hits again, a `path` list that drifts extracts part of the entry while the restore still reports a
    # hit. What each key covers, and why an exclusion has to earn itself, is
    # `apps/web/content/docs/architecture/monorepo-tooling.md` → `## CI job shape`.
    #
    # `git ls-tree` over tracked files, so generated output (dist, barrels, *.tsbuildinfo, node_modules) is out
    # by construction and a `pull_request` event hits an entry a `push` saved. The awk subtracts the three
    # non-inputs: test/bench sources, the committed bench reports beside them (`*.bench.json`, `*.bench.md` and
    # their platform-suffixed variants), and every `.md` outside the app's `content` directory — the one place
    # a build reads markdown. The root manifest is an input because infra bundles it; the lockfile and the
    # catalog so a dependency bump is a new key.
    - name: 🔑 Compute build cache keys
      id: keys
      shell: bash
      run: |
        readTrackedInputs() {
          git ls-tree -r HEAD "$@" | awk -F'\t' '$2 ~ /\.(test|test-d|bench)\.ts$/ || $2 ~ /\.bench(\.[^.]+)?\.(json|md)$/ || ($2 ~ /\.md$/ && $2 !~ /^apps\/web\/content\//) { next } { print }'
        }
        # Walked once: the app key is the package key's inputs plus the app's
        packageInputs="$(
          readTrackedInputs packages
          git rev-parse HEAD:package.json HEAD:pnpm-lock.yaml HEAD:pnpm-workspace.yaml
        )"
        {
          echo "package-builds-key=package-builds-$(echo "$packageInputs" | sha256sum | cut -d' ' -f1)"
          echo "app-build-key=app-build-$({ echo "$packageInputs"; readTrackedInputs apps/web; } | sha256sum | cut -d' ' -f1)"
        } >> "$GITHUB_OUTPUT"
