name: Get Build Cache Keys
description: Compute the content hashes that key the package-builds and app-build caches, and the path list the package-builds entry is saved and restored with, shared by the workflows that save one and every workflow that restores one
outputs:
  app-build-hash:
    description: sha256 over every tracked file `pnpm build:app` could read — the package-builds inputs plus `packages/app`
    value: ${{ steps.keys.outputs.app-build-hash }}
  package-builds-hash:
    description: sha256 over every tracked file `pnpm build:packages` could read
    value: ${{ steps.keys.outputs.package-builds-hash }}
  package-builds-paths:
    description: The paths the package-builds cache entry and its artifact hold — `packages/*/dist` and the generated barrels
    value: ${{ steps.paths.outputs.package-builds-paths }}
runs:
  using: composite
  steps:
    # An action rather than a copy per workflow, because both halves of a cache entry's address fail silently. A
    # key that drifts from the save's simply never hits again, and the only symptom is a build everyone assumed
    # was cached. A `path` list that drifts extracts part of the entry — or none of it — while the restore still
    # reports a hit. So both get one definition here, and no job trusts that hit: each verifies the build output
    # on disk with the `verify-package-builds` action before it skips a build.
    #
    # Both keys are a content hash (mode + blob hash + path) of the TRACKED files under `packages/` that the
    # build could read, plus the root package.json (infra bundles it via
    # `import packageJson from "../../../../package.json"`), the lockfile, the catalog and `virrun.config.ts`.
    # Reading the lockfile and the catalog is what makes a dependency bump — a catalog version, a resolution —
    # a new key rather than a stale hit; reading `virrun.config.ts` is what makes a change to the backend
    # `pnpm build:app` runs under one, since the root package.json only carries the script that names `virrun`.
    #
    # Everything is an input until proven otherwise, and only four things are subtracted. Three are subtracted
    # from both keys: test/bench sources, which no entrypoint reaches and which change far more often than
    # anything they sit beside; the committed bench reports beside them (`*.bench.json`, `*.bench.md` and
    # their platform-suffixed variants) — a `pnpm bench` run rewrites those in `packages/app` and `virrun`
    # alike, and hashing them cost a full app rebuild for a number no build reads; and every `.md` outside the
    # app's `content` directory. Exactly one thing here reads markdown: the @nuxt/content collection, whose
    # source is `docs/**/*.md` under that directory — so the subtraction is scoped to what that collection
    # cannot reach rather than to a package, and a README or a CHANGELOG is prose no build opens wherever it
    # sits. Scoping it to the package instead would leave the app's own pair hashed, and the release that
    # rewrites a CHANGELOG in every package writes one there too — private or not, since versioning is not
    # publishing — so the release commit would still pay the app build, which is the longest job in CI. The
    # fourth is `packages/app` itself, subtracted from the package key alone because no consumer of that cache
    # builds it — that sweeps the app's remaining markdown with everything else under there, so the package key
    # needs no markdown clause of its own. The two failure
    # directions are not symmetric — subtracting too little costs one rebuild on a push that was already
    # touching a package's internals, while subtracting too much serves a `dist` that does not match the source
    # it claims to be built from, and every check downstream then passes against the stale artifact. So the
    # default is to hash it, and an exclusion has to earn itself. That also means a build input of a new shape
    # needs nothing done to it: it is already in both keys.
    #
    # Tracked files only, so generated output (dist, ctix barrels, *.tsbuildinfo, node_modules) stays out by
    # construction. It is also what lets a `pull_request` event hit a cache a `push` event saved: the hash is
    # over content, so a merge commit whose `packages/` tree matches the branch head's keys to the same entry.
    - name: 🔑 Compute build cache keys
      id: keys
      shell: bash
      run: |
        readBuildInputs() {
          git ls-tree -r HEAD packages | awk -F'\t' '$2 ~ /\.(test|test-d|bench)\.ts$/ || $2 ~ /\.bench(\.[^.]+)?\.(json|md)$/ || ($2 ~ /\.md$/ && $2 !~ /^packages\/app\/content\//) { next } { print }'
          git rev-parse HEAD:package.json HEAD:pnpm-lock.yaml HEAD:pnpm-workspace.yaml HEAD:virrun.config.ts
        }
        {
          echo "app-build-hash=$(readBuildInputs | sha256sum | cut -d' ' -f1)"
          echo "package-builds-hash=$(readBuildInputs | awk -F'\t' '$2 ~ /^packages\/app\// { next } { print }' | sha256sum | cut -d' ' -f1)"
        } >> "$GITHUB_OUTPUT"
    # `packages/*/dist` is the build output and `packages/*/src/**/index.ts` are the ctix-generated barrels
    # (gitignored, absent on a fresh checkout). Both are produced by `pnpm build:packages`, and both share the
    # `packages/` common ancestor, so the artifact made from them downloads into `packages`. Five workflows save
    # or restore this entry; none of them repeats these two globs.
    - name: 🗂️ Emit the package-builds path list
      id: paths
      shell: bash
      run: |
        {
          echo 'package-builds-paths<<PACKAGE_BUILDS_PATHS'
          echo 'packages/*/dist'
          echo 'packages/*/src/**/index.ts'
          echo 'PACKAGE_BUILDS_PATHS'
        } >> "$GITHUB_OUTPUT"
