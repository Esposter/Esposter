name: Trust Workspace
description: Pre-accept Claude Code's trust dialog for the checkout, so a headless session on a fresh runner honours the repo's permissions.allow entries
runs:
  using: composite
  steps:
    # A fresh runner has no ~/.claude.json, so Claude Code treats the checkout as untrusted and ignores every
    # permissions.allow entry in .agents/settings.local.json. Pre-accepting the trust dialog silences that. One
    # definition for every workflow that runs Claude Code headless — the warmup and the review collector.
    - name: 🤝 Trust the workspace
      shell: bash
      run: |
        node -e '
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const file = path.join(os.homedir(), ".claude.json");
          const config = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : {};
          config.projects ??= {};
          config.projects[process.env.GITHUB_WORKSPACE] ??= {};
          config.projects[process.env.GITHUB_WORKSPACE].hasTrustDialogAccepted = true;
          fs.writeFileSync(file, JSON.stringify(config, null, 2));
        '
