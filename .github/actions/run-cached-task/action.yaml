name: Run Cached Task
description: Run one task of the root vite.config.ts under vp's traced cache — the cache directory a previous run saved restored first, and saved back when the task executed rather than replayed
inputs:
  task:
    description: The task's name in the root vite.config.ts, e.g. `build:packages`
    required: true
  paths:
    description: Generated files the task's directory listings name, carried with the cache so a fresh checkout lists what the recorded run listed
    required: false
    default: ""
  save:
    description: Save the cache directory after an executed run. Off for a consumer that only reads what 🏗️ CI saves
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # By prefix, and safely so: vp replays an entry only when every input it traced still matches, so another
    # commit's entry is a miss rather than a stale hit. After the install, because the directory is under
    # `node_modules`, and because the traced inputs include the dependencies a task read there.
    # @TODO: https://github.com/voidzero-dev/vite-task/issues/504 — drop `paths` once a negative input pattern also
    # removes a name from a directory listing's fingerprint. Until then a listing that names a generated file the
    # fresh checkout lacks never matches, so the last run's copies are restored beside the cache. Their content is
    # no input, and a hit extracts the recorded outputs over them while a miss rebuilds them, so none survives a run.
    - name: ♻️ Restore the task cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules/.vite/task-cache
          ${{ inputs.paths }}
        key: vp-${{ inputs.task }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: vp-${{ inputs.task }}-

    # A package's barrel is regenerated by its build, but a directory that is no package has no build to regenerate it, so
    # a copy the last run saved outlives the removal and rides every later restore into the package builds artifact, where
    # knip reads it as an unused file. Dropping the copies that no manifest owns ends that cycle.
    - name: 🧹 Drop the barrels of directories that are no package
      if: inputs.paths != ''
      shell: bash
      run: |
        shopt -s nullglob
        for barrel in packages/*/src/index.ts; do
          [ -f "${barrel%/src/index.ts}/package.json" ] || rm -f "$barrel"
        done

    - name: ⚡ Run ${{ inputs.task }}
      id: run
      shell: bash
      env:
        TASK: ${{ inputs.task }}
      run: |
        set -o pipefail
        pnpm exec vp run "$TASK" 2>&1 | tee "$RUNNER_TEMP/vp-run.log"
        grep -q "cache hit, replaying" "$RUNNER_TEMP/vp-run.log" && echo "replayed=true" >> "$GITHUB_OUTPUT" || true
    # A replay changed nothing worth a new entry; a missed match only costs a redundant save. Saved only from the default
    # branch and `ai/queue`, as every cache is (`openspec/specs/architecture/ci-caches/design.md`)
    - name: 💾 Save the task cache
      if: inputs.save == 'true' && steps.run.outputs.replayed != 'true' && (github.ref_name == 'main' || github.ref_name == 'ai/queue')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules/.vite/task-cache
          ${{ inputs.paths }}
        key: vp-${{ inputs.task }}-${{ github.run_id }}-${{ github.run_attempt }}
