name: Install Projects
description: Install the selected workspace projects plus the root project that declares the toolchain — the one install invocation every job that runs pnpm scripts takes
inputs:
  filter:
    description: >
      A pnpm selector naming the projects this job reads — `@esposter/web...` for a job that only builds the app,
      `./packages/*` for the library build, left at its default for the repo-wide checks that run every project's
      own script. Narrowing it skips the excluded projects' dependency trees and their postinstalls, which is the
      whole cost of a project a job never touches.
    required: false
    # Every project — the same set a bare `pnpm i` lays down, spelled as a selector so one install step serves
    # the narrowed jobs and the repo-wide ones alike
    default: "*"
runs:
  using: composite
  steps:
    # The root `{.}` rides along with any selector, because the toolchain (`vite-plus`, `vitest`, `oxlint`,
    # the `typescript` alias) is declared there —
    # `openspec/specs/architecture/monorepo-tooling/design.md` → `## CI job shape` has why `includeWorkspaceRoot`
    # is refused.
    # `--fail-if-no-match` so a selector matching nothing fails here rather than as a missing module later.
    - name: 📦 Install the selected projects
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm --filter "$FILTER" --filter "{.}" --fail-if-no-match i
    # The store this install left is saved only on a miss of its lockfile key, and only from the default branch and
    # `ai/queue` (`openspec/specs/architecture/ci-caches/design.md`). A job that never restored a store has no key here
    - name: 💾 Save the pnpm store
      if: env.PNPM_STORE_KEY != '' && env.PNPM_STORE_HIT != 'true' && (github.ref_name == 'main' || github.ref_name == 'ai/queue')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: ${{ env.PNPM_STORE_KEY }}
