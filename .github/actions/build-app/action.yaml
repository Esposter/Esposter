name: Build App
description: Build one app on top of the library builds 🏗️ CI cached — restore them, install the app's closure, rebuild the libraries only when the restore left a `dist` missing, then build the app itself from the source this job checked out
inputs:
  package:
    description: The app's npm name, e.g. `@esposter/functions` — the install, the dependency build and the app build are all selected from it
    required: true
runs:
  using: composite
  steps:
    - name: 🔑 Get build cache keys
      id: keys
      uses: ./.github/actions/get-build-cache-keys
    # Restore only: this job builds a subset, so saving from here would publish a partial `dist` set under the
    # full build's key
    - name: ♻️ Restore package builds
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.package-builds-paths }}
        key: package-builds-${{ steps.keys.outputs.package-builds-hash }}
    # The root closure for the toolchain, as `setup-packages` explains — `typescript` above all, which no
    # library redeclares and the dependency build below generates declarations with
    - name: 📦 Install dependencies
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: pnpm --filter "$PACKAGE..." --filter "{.}..." --fail-if-no-match i
    # A build skipped on `cache-hit` over a partial extract hands the app an empty dependency — Pulumi an empty
    # program, the Functions zip a `dist` that registers nothing while the host reports Running
    - name: 🔍 Verify package builds
      id: verify
      uses: ./.github/actions/verify-package-builds

    - name: 🏗️ Build dependencies
      if: steps.verify.outputs.complete != 'true'
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: pnpm --filter "$PACKAGE^..." build
    # Always: the artifact carries libraries only, and this bundle is what the caller ships
    - name: 🏗️ Build
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: pnpm --filter "$PACKAGE" build
