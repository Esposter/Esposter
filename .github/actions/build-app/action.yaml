name: Build App
description: Build one app from the source this job checked out — install the app's closure, build the libraries it links against, then the app itself
inputs:
  package:
    description: The app's npm name, e.g. `@esposter/functions` — the install, the dependency build and the app build are all selected from it
    required: true
runs:
  using: composite
  steps:
    # The root rides along for the toolchain — `typescript` above all, which no library redeclares and
    # the dependency build below generates declarations with
    - name: 📦 Install dependencies
      uses: ./.github/actions/install-projects
      with:
        filter: ${{ inputs.package }}...

    # Uncached: 🏗️ CI's task cache holds the full library set, which this closure-only install cannot replay, and
    # a deploy is rare enough that building the few libraries an app links against is the cheaper trade
    - name: 🏗️ Build dependencies
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: pnpm --filter "$PACKAGE^..." build
    # Always: the artifact carries libraries only, and this bundle is what the caller ships
    - name: 🏗️ Build
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: pnpm --filter "$PACKAGE" build
