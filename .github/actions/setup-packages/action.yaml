name: Setup Packages
description: Install dependencies, then download the compiled library output (dist + generated barrels) produced by the build-packages job
inputs:
  install-filter:
    description: >
      A pnpm selector limiting the install to the projects this job reads — `@esposter/web...` for a job that
      only builds the app, left at its default for the repo-wide checks that run every project's own script.
      Narrowing it skips the excluded projects' dependency trees and their postinstalls, which is the whole cost
      of a project a job never touches.
    required: false
    # Every project — the same set a bare `pnpm i` lays down, spelled as a selector so one install step serves
    # the narrowed job and the repo-wide ones alike
    default: "*"
runs:
  using: composite
  steps:
    # The root closure `{.}...` rides along with any selector, because the toolchain (`virrun`, `vitest`,
    # `oxlint`, `tsx`, the `typescript` alias) is declared at the root and `virrun` is a workspace project whose
    # own dependency a filtered install would otherwise skip —
    # `apps/web/content/docs/architecture/monorepo-tooling.md` → `## CI job shape` has the failure each half
    # prevents and why `includeWorkspaceRoot` is refused.
    # `--fail-if-no-match` so a selector matching nothing fails here rather than as a missing module later.
    - name: 📦 Install the selected projects
      shell: bash
      env:
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: pnpm --filter "$INSTALL_FILTER" --filter "{.}..." --fail-if-no-match i
    # The artifact's entries share `packages` as their common ancestor, so that is where they unpack
    - name: 📥 Download package builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-builds
        path: packages
