name: Setup Packages
description: Install dependencies, then download the compiled library output (dist + generated barrels) produced by the build-packages job
inputs:
  filter:
    description: The pnpm selector `install-projects` takes — `@esposter/web...` for the app build, its default for the repo-wide checks
    required: false
    default: "*"
runs:
  using: composite
  steps:
    - name: 📦 Install the selected projects
      uses: ./.github/actions/install-projects
      with:
        filter: ${{ inputs.filter }}
    # The artifact's entries share `packages` as their common ancestor, so that is where they unpack
    - name: 📥 Download package builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-builds
        path: packages
