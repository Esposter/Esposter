name: Setup Packages
description: Install dependencies, then download the compiled package output (dist + generated barrels) produced by the build-packages job
runs:
  using: composite
  steps:
    - name: 📦 Install dependencies
      run: pnpm i
      shell: bash
    # `*/dist` is the published build output and `*/src/**/index.ts` are the ctix-generated barrels (gitignored,
    # Absent on a fresh checkout), under `apps/` and `packages/` alike. Both are produced once by the
    # `build-packages` job and passed here as the `package-builds` artifact; the two roots put their common
    # Ancestor at the repository root, so download into `.`.
    - name: 📥 Download package builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-builds
        path: .
