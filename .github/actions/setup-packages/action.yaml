name: Setup Packages
description: Install dependencies, then download the compiled library output (dist + generated barrels) produced by the build-packages job
inputs:
  install-filter:
    description: >
      A pnpm selector limiting the install to the projects this job reads — `@esposter/web...` for a job that
      only builds the app, empty for the repo-wide checks that run every project's own script. Narrowing it
      skips the excluded projects' dependency trees and their postinstalls, which is the whole cost of a
      project a job never touches.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The root project *and its dependency closure* are added to whatever selector arrives, because the root is
    # Where the toolchain itself is declared: `virrun`, `vitest`, `oxlint`, `oxfmt`, `tsx` and the `typescript`
    # Alias are root devDependencies, so a narrowed install without it lays down no `virrun` bin and the first
    # `virrun -- …` script in the job fails on a missing binary rather than on anything the filter was about.
    # The closure `{.}...` rather than a bare `.`, because part of that toolchain is a workspace project of our
    # Own: a filtered install builds `node_modules` for the selected projects only, so selecting the root alone
    # Links `virrun` in without ever installing what `packages/virrun` itself needs, and the bin then dies on
    # `ERR_MODULE_NOT_FOUND: Cannot find package 'unconfig'` — its one runtime dependency, external by design
    # (see that package's tsdown config). Doing it here means a caller names only what it reads and never has to
    # Remember the root. The alternative — an
    # `includeWorkspaceRoot: true` setting in `pnpm-workspace.yaml` — is refused: it also pushes the root into
    # Every recursive `run`, and the root's own `lint` script ends in `pnpm -r run lint`, which would then
    # Include the root and recurse. `--fail-if-no-match` so a selector that matches nothing fails here, where
    # The cause is readable, instead of as a missing module several steps later.
    - name: 📦 Install dependencies
      shell: bash
      env:
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: |
        if [ -n "$INSTALL_FILTER" ]; then
          pnpm --filter "$INSTALL_FILTER" --filter "{.}..." --fail-if-no-match i
        else
          pnpm i
        fi
    # `packages/*/dist` is the published build output and `packages/*/src/**/index.ts` are the ctix-generated
    # Barrels (gitignored, absent on a fresh checkout). Both are produced once by the `build-packages` job and
    # Passed here as the `package-builds` artifact, whose entries share `packages` as their common ancestor —
    # So that is the directory they unpack into. An app's `dist` is not in it: nothing imports one, so each app
    # Builds in the workflow that ships it.
    - name: 📥 Download package builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-builds
        path: packages
