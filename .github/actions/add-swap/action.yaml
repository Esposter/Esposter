name: Add Swap
description: Give the runner a swap file, so a check that peaks above its memory slows down rather than ending the runner
runs:
  using: composite
  steps:
    # `ubuntu-latest` has 16 GB of memory and no swap, and `nuxt typecheck` of the app alone grows to 14 GB of it, so a
    # session that runs it beside its own tools used it all and the runner was shut down ("The runner has received a
    # shutdown signal"). The root disk has about 79 GB free, which a swap file spends
    - name: 💾 Add swap
      shell: bash
      run: |
        sudo fallocate -l 32G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
