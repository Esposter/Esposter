name: Put Worker Secrets
description: Upload one Worker's secrets with wrangler secret bulk, from the file gather-worker-secrets wrote for it. The values are never written to the log or the tree
inputs:
  directory:
    description: The Worker's app directory, whose wrangler configuration names the Worker the secrets go to
    required: true
  file:
    description: The secrets file gather-worker-secrets wrote for this Worker
    required: true
  config:
    description: A build-generated wrangler configuration, relative to `directory`, that names the Worker for one environment alone, e.g. the web build's `.output/server/wrangler.json`. `secret bulk` does not follow the deploy redirect to it, and with `CLOUDFLARE_ENV` set, wrangler names a configuration without `env` blocks `<name>-<env>`, so the variable is cleared for that call
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: 🔐 Put the secrets with the build's configuration
      if: inputs.config != ''
      shell: bash
      env:
        CLOUDFLARE_ENV: ""
        CONFIG: ${{ inputs.config }}
        DIRECTORY: ${{ inputs.directory }}
        SECRETS_FILE: ${{ inputs.file }}
      run: pnpm -C "$DIRECTORY" exec wrangler secret bulk "$SECRETS_FILE" --config "$CONFIG"
    - name: 🔐 Put the secrets
      if: inputs.config == ''
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
        SECRETS_FILE: ${{ inputs.file }}
      run: pnpm -C "$DIRECTORY" exec wrangler secret bulk "$SECRETS_FILE"
