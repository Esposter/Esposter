name: Setup Project Dependencies
description: Install pnpm and the node runtime, and restore the pnpm store cache
inputs:
  bubblewrap-sandbox:
    description: Install bubblewrap and enable unprivileged user namespaces for test/bench jobs that exercise the virrun os backend
    required: false
    default: false
runs:
  using: composite
  steps:
    # `pnpm -r` interleaves concurrent packages' output, which a log read after the fact wants contiguous. Set
    # here rather than per workflow because every job that runs pnpm passes through this action. pnpm reads
    # `PNPM_CONFIG_<SETTING>` (`npm_config_*` is not read). First step, because `GITHUB_ENV` reaches the steps
    # after it.
    - name: 🪵 Keep each package's output contiguous
      shell: bash
      run: echo "PNPM_CONFIG_AGGREGATE_OUTPUT=true" >> "$GITHUB_ENV"
    # pnpm from `packageManager`, node from `devEngines.runtime`. `install: false` because each caller owns its
    # own install — the root alone with `--ignore-scripts` for format, the artifact-aware `setup-packages`
    # everywhere else.
    - name: 📦 Install pnpm and node
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        cache: true
        install: false
    # GitHub's Ubuntu images restrict unprivileged user namespaces, and the older ones ship no bubblewrap at all,
    # so without this the virrun os-backend suites self-gate and silently skip. The sysctl is not swallowed: the
    # key exists on every image that restricts user namespaces, so a refused write surfaces here by name rather
    # than one line later as a probe failing for no stated reason.
    - name: 📦 Enable bubblewrap sandbox
      if: ${{ fromJSON(inputs.bubblewrap-sandbox) }}
      shell: bash
      # apt only where the binary is missing: `ubuntu-26.04`, the image the one caller pins, already carries a
      # bubblewrap newer than the suites need, so the install is a package-list download that reports
      # `already the newest version`. An image shipping an *old* one is not a case apt rescues either — it would
      # install that release's newest, which is the copy already there — so the version gate is the probe below,
      # whose `--tmp-overlay` needs >= 0.10.0 and fails loudly on anything older.
      run: |
        command -v bwrap > /dev/null || {
          sudo apt-get update
          sudo apt-get install -y bubblewrap
        }
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        dir="$(mktemp -d)"
        bwrap --unshare-all --die-with-parent --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
          --overlay-src "$dir" --tmp-overlay "$dir" --chdir "$dir" -- true
