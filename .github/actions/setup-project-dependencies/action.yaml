name: Setup Project Dependencies
description: Install pnpm and the node runtime
runs:
  using: composite
  steps:
    # `pnpm -r` interleaves concurrent packages' output, which a log read after the fact wants contiguous. Set
    # here rather than per workflow because every job that runs pnpm passes through this action. pnpm reads
    # `PNPM_CONFIG_<SETTING>` (`npm_config_*` is not read). First step, because `GITHUB_ENV` reaches the steps
    # after it.
    - name: 🪵 Keep each package's output contiguous
      shell: bash
      run: echo "PNPM_CONFIG_AGGREGATE_OUTPUT=true" >> "$GITHUB_ENV"
    # pnpm from `packageManager`, node from `.node-version`. `install: false` because each caller owns its
    # own install — the root alone with `--ignore-scripts` for format, `install-projects` everywhere else. `cache`
    # stays off: the pnpm store is not cached at all (`openspec/specs/architecture/ci-caches/design.md` → Settled).
    - name: 📦 Install pnpm and node
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        install: false
