name: Setup Project Dependencies
description: Install pnpm and the node runtime, and restore the pnpm store cache
inputs:
  bubblewrap-sandbox:
    description: Install bubblewrap and enable unprivileged user namespaces for test/bench jobs that exercise the virrun os backend
    required: false
    default: false
runs:
  using: composite
  steps:
    # `pnpm -r` interleaves concurrent packages' output, which a log read after the fact wants contiguous. Set
    # here rather than per workflow because every job that runs pnpm passes through this action. pnpm reads
    # `PNPM_CONFIG_<SETTING>` (`npm_config_*` is not read). First step, because `GITHUB_ENV` reaches the steps
    # after it.
    - name: 🪵 Keep each package's output contiguous
      shell: bash
      run: echo "PNPM_CONFIG_AGGREGATE_OUTPUT=true" >> "$GITHUB_ENV"
    # pnpm from `packageManager`, node from `devEngines.runtime`. `install: false` because each caller owns its
    # own install — the root alone with `--ignore-scripts` for format, the artifact-aware `setup-packages`
    # everywhere else.
    - name: 📦 Install pnpm and node
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        cache: true
        install: false
    # GitHub's Ubuntu image ships neither bubblewrap nor permissive unprivileged user namespaces, so without this
    # the virrun os-backend suites self-gate and silently skip. The sysctl is not swallowed: the key exists on
    # every image that restricts user namespaces, so a refused write surfaces here by name rather than one line
    # later as a probe failing for no stated reason.
    - name: 📦 Enable bubblewrap sandbox
      if: ${{ fromJSON(inputs.bubblewrap-sandbox) }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        dir="$(mktemp -d)"
        bwrap --unshare-all --die-with-parent --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
          --overlay-src "$dir" --tmp-overlay "$dir" --chdir "$dir" -- true
