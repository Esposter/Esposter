  # Renovate keeps owning their versions; its `vite`, aliased to Vite+'s own core, takes the global `vite` above.
  vite-plus>@oxlint/plugins: "catalog:"
  "vite-plus>@vitest/browser": "catalog:"
  "vite-plus>@vitest/browser-preview": "catalog:"
  "vite-plus>@vitest/mocker": "catalog:"
  "vite-plus>@vitest/pretty-format": "catalog:"
