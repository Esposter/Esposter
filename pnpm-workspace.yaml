catalogMode: strict

cleanupUnusedCatalogs: true

minimumReleaseAge: 0

# Node prints the stack behind each warning (a MaxListenersExceededWarning names the emitter but not who added the listener),
# so every script run through pnpm traces its warnings
nodeOptions: --max-old-space-size=8192 --trace-warnings

overrides:
  nitro: npm:nitro-nightly@latest
  typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2
  # Nuxt's and its tools' optional `oxc-parser` peers resolve per subtree, so the stable and nightly stacks each took their
  # own 0.140, 0.153, 0.154 or 0.155 copy, and `nuxt-nightly` split into peer variants that each declare a separate `NuxtApp`.
  # One forced copy keeps a single `nuxt-nightly`; remove once Nuxt pins `oxc-parser` so its peers stop resolving loose
  oxc-parser: "catalog:"
  vite: "catalog:"
  # @TODO: no upstream issue — phaser4-rex-plugins 4.2.0 still declares i18next-http-backend `^3.0.5`, below the patched 4.0.2
  # of GHSA-xvq9-wjp8-hwqf, so this override holds it on 4.x: drop it once rexrainbow/phaser3-rex-notes declares a patched range
  phaser4-rex-plugins>i18next-http-backend: ^4.0.6
  # vp runs the catalog's tools rather than the exact copies vite-plus pins, so the lockfile holds one of each and
  # Renovate keeps owning their versions; its `vite`, aliased to Vite+'s own core, takes the global `vite` above.
  vite-plus>@oxlint/plugins: "catalog:"
  "vite-plus>@vitest/browser": "catalog:"
  "vite-plus>@vitest/browser-preview": "catalog:"
  "vite-plus>@vitest/mocker": "catalog:"
  "vite-plus>@vitest/pretty-format": "catalog:"
  "vite-plus>@vitest/snapshot": "catalog:"
  "vite-plus>@vitest/spy": "catalog:"
  "vite-plus>@vitest/utils": "catalog:"
  vite-plus>oxfmt: "catalog:"
  vite-plus>oxlint: "catalog:"
  vite-plus>oxlint-tsgolint: "catalog:"
  vite-plus>vitest: "catalog:"

shellEmulator: true
permissions:
  "@nuxtjs/seo":
    skills: true
  "@trpc/client":
    skills: true
  "@trpc/server":
    skills: true
  drizzle-kit:
    skills: true
  phaser:
    skills: true
