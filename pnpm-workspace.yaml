packages:
  - apps/*
  - packages/*
  - scripts

# A recursive run reports every project's result rather than stopping at the first failure and killing the rest,
# Because almost every one here is a check: a check reads the tree and produces nothing, so a bailed run hides
# However many failures sat behind the first, and each one hidden is another full round of fix-and-rerun. The run
# Still exits non-zero, so nothing is swallowed. `build:packages` is the exception and passes `--bail` itself,
# Since a later build consumes what an earlier one produced and the failures after it would be that one restated.
bail: false

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  # Its postinstall only writes the browser service worker (`msw init public/`); tests intercept in node
  msw: false
  # Its install only checks that the prebuilt binaries it ships are there, and builds from source when they are not
  node-pty: false
  # Its postinstall only fetches the CUDA runtime on Linux; the CPU and Windows binaries ship in the package
  onnxruntime-node: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# Every non-frozen install dedupes as it resolves, so a hand bump and a Renovate branch leave the same lockfile a
# `pnpm dedupe` would; a frozen install (CI) never rewrites it.
# The lockfile records these settings, so a `pnpm run` after a frozen install does not start a second install
autoDedupe: true
lockfile:
  includeResolutionSettings: true

