catalogMode: strict

cleanupUnusedCatalogs: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 0

# Node prints the stack behind each warning (a MaxListenersExceededWarning names the emitter but not who added the listener),
# so every script run through pnpm traces its warnings
nodeOptions: --max-old-space-size=8192 --trace-warnings

overrides:
  # RealtimeKit declares uuid `^8.3.2`, below the patched 11.1.1 of GHSA-w5hq-g745-h8pq: drop once it declares a patched range
  "@cloudflare/realtimekit>uuid": ^14.0.3
  # Arborist, lerna-lite's publish, sigstore's tuf and js-beautify's editorconfig still declare minimatch 10, below the
  # patched 11.0.1 of GHSA-g3hv-75wg-m249, which glob and map-workspaces already take: drop once those declare 11
  "minimatch@<11.0.1": ^11.0.9
  # @TODO: https://github.com/nitrojs/nitro/releases/tag/v3.0.0 — back to a range once Nitro 3 reaches `latest`
  nitro: npm:nitro-nightly@latest
  # Nuxt's and its tools' optional `oxc-parser` peers resolve per subtree, so the stable and nightly stacks each took their
  # own 0.140, 0.153, 0.154 or 0.155 copy, and `nuxt-nightly` split into peer variants that each declare a separate `NuxtApp`.
  # One forced copy keeps a single `nuxt-nightly`; remove once Nuxt pins `oxc-parser` so its peers stop resolving loose
  oxc-parser: "catalog:"
  # @TODO: https://github.com/rexrainbow/phaser3-rex-notes/pull/603 — phaser4-rex-plugins 4.2.0 still declares
  # i18next-http-backend `^3.0.5`, below the patched 4.0.2 of GHSA-xvq9-wjp8-hwqf, so this override holds it on 4.x: drop it
  # once rexrainbow/phaser3-rex-notes declares a patched range
  phaser4-rex-plugins>i18next-http-backend: ^4.1.0
  typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2
  vite: "catalog:"
  # vp runs the catalog's tools rather than the exact copies vite-plus pins, so the lockfile holds one of each and
  # Renovate keeps owning their versions; its `vite`, aliased to Vite+'s own core, takes the global `vite` above.
  vite-plus>@oxlint/plugins: "catalog:"
  "vite-plus>@vitest/browser": "catalog:"
  "vite-plus>@vitest/browser-preview": "catalog:"
  "vite-plus>@vitest/mocker": "catalog:"
  "vite-plus>@vitest/pretty-format": "catalog:"
  "vite-plus>@vitest/snapshot": "catalog:"
  "vite-plus>@vitest/spy": "catalog:"
  "vite-plus>@vitest/utils": "catalog:"
  vite-plus>oxfmt: "catalog:"
  vite-plus>oxlint: "catalog:"
  vite-plus>tsrs: "catalog:"
  vite-plus>vitest: "catalog:"

packageExtensions:
  # Each package below has types that import a package it does not declare. The hoisted layout hid that; in the global
  # Virtual store a package sees only what it declares, so those types fell to `any` until each names its peer
  # @TODO: https://github.com/cloudflare/workers-sdk/issues/16982 — miniflare's types import @cloudflare/workers-types,
  # Which it declares only as a devDependency
  miniflare:
    peerDependencies:
      "@cloudflare/workers-types": "*"
  # @nuxt/schema's types import the packages its options configure and declare none of them, by design: an app installs
  # The builder it uses. Each is optional, so it is linked only where the checkout installs it
  "@nuxt/schema-nightly":
    peerDependencies:
      "@unhead/vue": "*"
      "h3": "*"
      "unctx": "*"
      "unimport": "*"
      "vite": "*"
      "vue": "*"
      "vue-router": "*"
    peerDependenciesMeta:
      "@unhead/vue":
        optional: true
      "h3":
        optional: true
      "unctx":
        optional: true
      "unimport":
        optional: true
      "vite":
        optional: true
      "vue":
        optional: true
      "vue-router":
        optional: true
  # @TODO: https://github.com/nitrojs/nitro/releases/tag/v3.0.0 — drop with the `nitro` alias, once Nitro 3 reaches `latest`
  # Nitro's nightly is installed under the `nitro` alias, and its types import themselves by that name (`nitro/types`),
  # Which its own folder in the store, named `nitro-nightly`, cannot resolve until the alias is linked beside it
  nitro-nightly:
    peerDependencies:
      nitro: "*"
  # Three ships no types, and its add-ons leave `@types/three` to the app, as three's own docs ask the app to install it
  "@pmndrs/pointer-events":
    peerDependencies:
      "@types/three": "*"
  "@tresjs/cientos":
    peerDependencies:
      "@types/three": "*"
  "@tresjs/core":
    peerDependencies:
      "@types/three": "*"
  "camera-controls":
    peerDependencies:
      "@types/three": "*"
  "three-conic-polygon-geometry":
    peerDependencies:
      "@types/three": "*"
  "three-custom-shader-material":
    peerDependencies:
      "@types/three": "*"
  "three-geojson-geometry":
    peerDependencies:
      "@types/three": "*"
  "three-globe":
    peerDependencies:
      "@types/three": "*"
  "three-mesh-bvh":
    peerDependencies:
      "@types/three": "*"
  "three-slippy-map-globe":
    peerDependencies:
      "@types/three": "*"
  "three-stdlib":
    peerDependencies:
      "@types/three": "*"
permissions:
  "@nuxtjs/seo":
    skills: true
  "@trpc/client":
    skills: true
  "@trpc/server":
    skills: true
  drizzle-kit:
    skills: true
  phaser:
    skills: true
  phaser4-rex-plugins:
    skills: true
  tsdown:
    skills: true
shellEmulator: true

# Every checkout on a machine, and every CI job, links its packages from one virtual store under the pnpm store's
# `links` folder, so a worktree's install only writes symlinks and the machine holds one copy of each resolved package
# rather than one per checkout. This file is the one place the layout is set: a `vp run` task starts a pnpm of its own,
# which reads this file and not the job's environment, so an environment override split the layout between the install
# and the installs the tasks started, and those rebuilt the tree under the other tasks mid-run
virtualStoreType: global
