reviews:
  path_filters:
    - "!pnpm-lock.yaml"
    # auto-generated migrations
    - "!packages/app/server/db/migrations/**"
    # documentation content (prose, reviewed by humans)
    - "!packages/app/content/docs/**"
    # legacy docs trees deleted after migrating into packages/app/content/docs
    - "!features/**"
    - "!architecture/**"

  auto_review:
    ignore_usernames:
      - renovate[bot]
