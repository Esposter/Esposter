reviews:
  path_filters:
    - "!pnpm-lock.yaml"
    # auto-generated migrations
    - "!packages/app/server/db/migrations/**"
    # generated pglite snapshot (binary)
    - "!packages/db-mock/src/snapshot.tar.gz"

    # temporary: the resource-explorer + messaging sweep window overshot the file cap by 6.
    # Every entry below carries no reviewable content of its own — a repeated one-line deletion
    # whose representative stays in review, a pure rename, and a single list entry.
    # Remove these once the develop -> main review for that window completes.
    #
    # the same `useSeoMeta({ ogTitle: name, ogUrl: useRequestURL().href, title: name })` deletion,
    # repeated verbatim. Resource/Flowchart/View.vue carries the identical deletion and is NOT
    # excluded, so the change itself is still reviewed once.
    - "!packages/app/app/components/Resource/Dashboard/View.vue"
    - "!packages/app/app/components/Resource/Email/View.vue"
    - "!packages/app/app/components/Resource/Note/View.vue"
    - "!packages/app/app/components/Resource/Survey/View.vue"
    - "!packages/app/app/components/Resource/Webpage/View.vue"
    # pure rename (R100), lowercase -> PascalCase to match the export; zero content change
    - "!packages/app/app/services/dashboard/VisualTypeItemCategoryDefinitions.ts"
    # adds the string "caching" to a docs nav group; no logic
    - "!packages/app/app/services/docs/DocsSectionGroupsMap.ts"

  auto_review:
    ignore_usernames:
      - renovate[bot]
