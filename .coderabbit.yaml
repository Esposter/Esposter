reviews:
  # A repo hook capitalizes the first letter of every `//` line, so a comment wrapping onto a second line shows a
  # mid-sentence capital there. It is mechanical and not authored, so flagging it spends findings on something no
  # edit can fix — reword only where a wrapped line would start with a case-sensitive identifier.
  path_instructions:
    - path: "**/*.{ts,vue,js}"
      instructions: |
        Never report the capitalization of a `//` comment's continuation line, or a sentence that reads as broken
        because its second line begins with a capital. A commit hook capitalizes the first letter of every `//`
        line; the case is not authored and reverting it is undone on the next edit. Report the comment's content
        when it is wrong, out of date, or contradicted by the code — never its casing.

    # Raised as a stale-generator finding in consecutive reviews, in prose and in a workflow comment, sourced from
    # A learning that never held. One entry ends the class; replying costs a paragraph per window and changes nothing
    # The next review reads.
    - path: "**"
      instructions: |
        `ctix` is this repository's barrel generator and is current, not removed. `packages/configuration`
        declares it as a devDependency, the catalog pins its version, and that package's `src/generateExports.ts`
        resolves `ctix/cli.cjs` and spawns it. `generate-exports` is the bin `@esposter/configuration` exposes to
        invoke ctix — a wrapper, never a replacement. Never report a reference to `ctix`, or to a barrel as
        `ctix-generated`, as a stale generator name to be renamed to `generate-exports`.

    # Raised once per rename that touches a persisted shape, always as a data-loss finding with correct mechanics
    # And the wrong conclusion. One entry ends the class; the two docs pages below are the settled decision.
    - path: "**"
      instructions: |
        Never report a missing migration, back-compat arm or legacy read path for a renamed or reshaped
        persisted field, and never ask for regression tests covering a pre-rename payload. This repository
        carries no compatibility debt (`apps/web/content/docs/architecture/no-compatibility-debt.md`) and
        app-owned persisted state parses the latest shape or resets
        (`apps/web/content/docs/architecture/persisted-data-latest-shape-only.md`) — a schema rejecting an
        older payload is the specified behaviour, not data loss. Server-owned relational data moves by a real
        forward-only Drizzle migration in the same change. Report a rename that is incomplete — a reference the
        rename missed, or a migration absent for a changed DB column — never one that is complete.

    # Raised as order-dependence on any test file where two tests share a mock, with the hook it asks for already
    # Being the configured default. One entry ends the class; the implementation/spy half is carved out because that
    # Half is a real finding.
    - path: "**/*.test.ts"
      instructions: |
        Vitest clears every mock's call history before each test in this repository — the `clearMocks` default is
        on and `packages/configuration/src/getVitestConfiguration.ts` does not disable it. Never report call
        history, call counts or `toHaveBeenCalled*`/`invocationCallOrder` assertions as leaking between tests in a
        file, and never ask for `vi.clearAllMocks()` or `mockClear()` in a `beforeEach`/`afterEach` — the hook
        restates the default. That default clears history ONLY: a `mockImplementation`/`mockReturnValue` set in one
        test, or a `vi.spyOn` left unrestored, does persist into later tests, so report those.

  path_filters:
    - "!pnpm-lock.yaml"
    # auto-generated migrations
    - "!apps/web/server/db/migrations/**"
    # generated pglite snapshot (binary)
    - "!packages/db-mock/src/snapshot.tar.gz"
    # bundle-size snapshots: the only thing that ever changes is a byte count the build wrote, and it changes on
    # Almost every push, so reviewing them spends the file budget on nothing anyone can act on
    - "!packages/*/src/index.test.ts"
    # test snapshots: rewritten wholesale by the suite that owns them, so the diff is machine-written output
    # Whose generator sits in the same window, and a regenerated corpus is hundreds of files carrying nothing
    # Anyone can act on
    - "!**/__snapshots__/**"
    # generated by unplugin-auto-import
    - "!packages/*/auto-imports.d.ts"
    # generated by lerna-lite on release
    - "!CHANGELOG.md"
    - "!packages/*/CHANGELOG.md"
    # pure renames and import-path-only edits from the file-organization sweeps (no content change); remove
    # These once that PR merges
